<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistem Pengiriman Undangan - Ihsan & Syarifah</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}.wrap{max-width:1100px;margin:auto;padding:16px}.header{background:linear-gradient(135deg,#315f8f,#6f94b8);color:white;border-radius:18px;padding:22px;margin-bottom:16px}.header h1{margin:0 0 5px;font-size:24px}.header p{margin:0}.logout{float:right;border:0;border-radius:9px;padding:9px 12px;background:#ffffff2b;color:white}.card{background:white;border-radius:16px;padding:17px;margin-bottom:15px;box-shadow:0 5px 18px #0000000d}select,input{width:100%;padding:12px;border:1px solid #d7dde5;border-radius:10px;font-size:15px}button{border:0;border-radius:9px;padding:10px 12px;font-weight:700;cursor:pointer}.primary{background:#315f8f;color:#fff}.secondary{background:#eef3f8;color:#315f8f}.success{background:#2e8b57;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#f6f8fb;border-radius:12px;padding:13px}.stat b{display:block;font-size:24px;color:#315f8f}.toolbar{display:grid;grid-template-columns:1fr 190px;gap:10px;margin-bottom:14px}.table-wrap{overflow:auto}table{width:100%;min-width:800px;border-collapse:collapse}th,td{padding:11px 9px;border-bottom:1px solid #edf0f4;text-align:left}th{background:#f7f9fc;color:#596575;font-size:13px}.actions{display:flex;gap:6px;flex-wrap:wrap}.status{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:bold}.pending{background:#fff2d8;color:#956100}.sent{background:#def5e8;color:#19703f}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.modalbox{background:white;border-radius:16px;padding:18px;max-width:650px;width:100%;max-height:88vh;overflow:auto}.message{white-space:pre-wrap;background:#f7f8fa;border:1px solid #e1e5ea;border-radius:12px;padding:14px;line-height:1.55;font-size:14px;margin-top:13px}.snack{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:9px;z-index:20}.snack.show{display:block}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:10px 3px}.stat b{font-size:20px}.actions button{flex:1}}</style></head><body><div class="wrap"><div class="header"><button id="logout" class="logout" style="display:none" onclick="logout()">Keluar</button><h1>SISTEM PENGIRIMAN UNDANGAN</h1><p>Ihsan &amp; Syarifah</p><div id="user" style="margin-top:7px;font-size:14px"></div></div><div id="login" class="card"><b>Pilih Pengirim</b><select id="sender" style="margin-top:10px"><option value="">-- Pilih nama pengirim --</option><option>Ihsan</option><option>Syarifah</option><option>Ibu Ihsan</option><option>Bapa Ihsan</option><option>Mama Syarifah</option><option>Bapa Syarifah</option></select><button class="primary" style="width:100%;margin-top:10px" onclick="login()">Masuk</button></div><div id="app" style="display:none"><div class="stats card"><div class="stat"><b id="total">0</b>Tamu Saya</div><div class="stat"><b id="pending">0</b>Belum Dikirim</div><div class="stat"><b id="sent">0</b>Sudah Terkirim</div></div><div class="card"><div class="toolbar"><input id="search" placeholder="🔎 Cari nama tamu..." oninput="render()"><select id="filter" onchange="render()"><option value="all">Semua Status</option><option>Belum dikirim</option><option>Terkirim</option></select></div><div id="loading">Memuat data tamu...</div><div id="table" class="table-wrap" style="display:none"><table><thead><tr><th>No.</th><th>Nama Tamu</th><th>Sapaan</th><th>No. WhatsApp</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="body"></tbody></table><div id="empty" style="display:none;text-align:center;padding:25px;color:#777">Belum ada tamu untuk pengirim ini.</div></div></div></div></div><div id="modal" class="modal" onclick="if(event.target===this)hidePreview()"><div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">💬 Preview Pesan</h3><button class="secondary" onclick="hidePreview()">Tutup</button></div><div id="message" class="message"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="secondary" style="flex:1" onclick="copyMessage()">Salin Pesan</button><button class="success" style="flex:1" onclick="sendPreview()">📲 Kirim</button></div></div></div><div id="snack" class="snack"></div><script>
const API_URL='https://script.google.com/a/*/macros/s/AKfycbzXdTs7LpenGEcu4HP3EOq_4TYleXYaN8EL7qbDeURb16MUU7-7ZNBRHjIlHEHkAiLOJA/exec';
const INVITATION_URL='https://ihsansyarifah.github.io/wedding-invitation/';
let guests=[],sender='',preview=null;
const $=id=>document.getElementById(id), clean=v=>v==null?'':String(v).trim();
function esc(v){return clean(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function phone(v){let p=clean(v).replace(/\D/g,'');if(!p)return'';if(p.startsWith('0'))p='62'+p.slice(1);else if(p.startsWith('8'))p='62'+p;return p.startsWith('62')?p:''}
function snack(t){$('snack').textContent=t;$('snack').classList.add('show');clearTimeout(window.st);window.st=setTimeout(()=>$('snack').classList.remove('show'),2500)}
function login(){sender=$('sender').value;if(!sender)return snack('Silakan pilih pengirim dulu.');localStorage.setItem('undangan_sender',sender);showApp();load()}
function showApp(){$('login').style.display='none';$('app').style.display='block';$('logout').style.display='block';$('user').textContent='Pengirim: '+sender}
function logout(){localStorage.removeItem('undangan_sender');sender='';guests=[];$('login').style.display='block';$('app').style.display='none';$('logout').style.display='none';$('user').textContent='';$('sender').value=''}
function load(){ $('loading').style.display='block';$('table').style.display='none';let cb='cb'+Date.now();window[cb]=r=>{if(r&&r.success)guests=r.data||[];else snack('Gagal mengambil data tamu.');update();render();$('loading').style.display='none';$('table').style.display='block';delete window[cb];document.getElementById(cb)?.remove()};let s=document.createElement('script');s.id=cb;s.src=API_URL+'?action=guests&callback='+cb+'&_='+Date.now();s.onerror=()=>snack('Gagal menghubungkan ke database.');document.body.appendChild(s)}
function mine(){return guests.filter(g=>clean(g['Pengirim'])===sender)}
function update(){let m=mine(),sent=m.filter(g=>clean(g['Status'])==='Terkirim').length;$('total').textContent=m.length;$('sent').textContent=sent;$('pending').textContent=m.length-sent}
function render(){let q=clean($('search').value).toLowerCase(),f=$('filter').value,b=$('body');b.innerHTML='';let list=mine().filter(g=>(!q||clean(g['Nama Tamu']).toLowerCase().includes(q)||clean(g['No. WhatsApp']).toLowerCase().includes(q))&&(f==='all'||clean(g['Status'])===f));$('empty').style.display=list.length?'none':'block';list.forEach((g,i)=>{let sent=clean(g['Status'])==='Terkirim',tr=document.createElement('tr');tr.innerHTML='<td>'+(i+1)+'</td><td><b>'+esc(g['Nama Tamu'])+'</b></td><td>'+esc(g['Sapaan'])+'</td><td>'+esc(g['No. WhatsApp'])+'</td><td><span class="status '+(sent?'sent':'pending')+'">'+esc(clean(g['Status'])||'Belum dikirim')+'</span></td><td><div class="actions"><button class="secondary" onclick="previewId(\''+esc(g['ID'])+'\')">💬 Lihat Pesan</button><button class="primary" onclick="sendId(\''+esc(g['ID'])+'\')">📲 Kirim</button><button class="'+(sent?'secondary':'success')+'" onclick="status(\''+esc(g['ID'])+'\',\''+(sent?'Belum dikirim':'Terkirim')+'\')">'+(sent?'↩ Belum':'☑ Terkirim')+'</button></div></td>';b.appendChild(tr)})}
function byId(id){return guests.find(g=>String(g['ID'])===String(id))}
function msg(g){let name=clean(g['Nama Tamu']),sapaan=clean(g['Sapaan'])||'Bapak/Ibu/Saudara/i';return `Yth. ${sapaan}${name?' '+name:''}\nDi Tempat\n-----------------------------------------------------\n\nبِسْــــــــــــــــــمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ\n\nٱلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللّٰهِ وَبَرَكَاتُهُ\n\n\nDengan segala kerendahan hati dan dengan ungkapan syukur atas karunia Allah SWT, kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri resepsi pernikahan putra-putri kami yang Insya Allah akan dilaksanakan pada:\n\n===========================\n🗓️ Hari, Tanggal: Minggu, 20 Desember 2026\n🕓 Jam: 11.00 - 14.00 WIB\n📍 Tempat: Gedung Daarul Matiin Cibadak\n(Jl. ........................)\nLink undangan dapat diakses lengkap di:\n${INVITATION_URL}?to=${encodeURIComponent(name)}\n===========================\n\nKehadiran Bapak/Ibu/Saudara/i adalah silaturahmi.\nDoa restu Bapak/Ibu/Saudara/i adalah kado terindah bagi kami.\nKehadiran Bapak/Ibu/Saudara/i adalah doa restu yang tidak ternilai harganya.\n\nJazakumullahu khoiron katsiron, hanya kepada Ilahi Robbi tercurah doa sebagai ungkapan terima kasih kami.\n\nوَالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللّٰهِ وَبَرَكَاتُهُ`}
function previewId(id){preview=byId(id);if(!preview)return; $('message').textContent=msg(preview);$('modal').classList.add('show')}
function hidePreview(){$('modal').classList.remove('show');preview=null}
function copyMessage(){if(!preview)return;navigator.clipboard.writeText(msg(preview)).then(()=>snack('Pesan berhasil disalin.')).catch(()=>snack('Tidak bisa menyalin otomatis.'))}
function wa(g){let p=phone(g['No. WhatsApp']);if(!p)return snack('Nomor WhatsApp tidak valid.');let a=document.createElement('a');a.href='https://wa.me/'+p+'?text='+encodeURIComponent(msg(g));a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove()}
function sendId(id){let g=byId(id);if(g)wa(g)}
function sendPreview(){if(preview){let g=preview;hidePreview();wa(g)}}
function status(id,st){let cb='st'+Date.now();window[cb]=r=>{if(r&&r.success){let g=byId(id);if(g)g['Status']=st;update();render();snack('Status diperbarui.')}else snack('Gagal memperbarui status.');delete window[cb];document.getElementById(cb)?.remove()};let s=document.createElement('script');s.id=cb;s.src=API_URL+'?action=updateStatus&id='+encodeURIComponent(id)+'&status='+encodeURIComponent(st)+'&callback='+cb+'&_='+Date.now();s.onerror=()=>snack('Gagal menghubungkan ke database.');document.body.appendChild(s)}
window.addEventListener('load',()=>{let s=localStorage.getItem('undangan_sender');if(s){sender=s;$('sender').value=s;showApp();load()}});
</script></body></html>
