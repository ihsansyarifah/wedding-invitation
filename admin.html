<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Ucapan - Ihsan & Syarifah</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3ef;
            color: #333;
        }

        .container {
            width: min(100% - 30px, 900px);
            margin: 0 auto;
        }

        header {
            background: white;
            border-bottom: 1px solid #eee;
            padding: 18px 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitle {
            margin-top: 5px;
            color: #888;
            font-size: 13px;
        }

        main {
            padding: 30px 0 50px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .login-card {
            max-width: 450px;
            margin: 50px auto;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-login {
            width: 100%;
            background: #333;
            color: white;
        }

        .btn-logout {
            background: #eee;
            color: #333;
        }

        .btn-delete {
            background: #d9534f;
            color: white;
        }

        .hidden {
            display: none !important;
        }

        .error {
            background: #fff0f0;
            color: #c62828;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .success {
            background: #effaf1;
            color: #287d36;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat {
            flex: 1;
            min-width: 150px;
            background: #f7f3ef;
            border-radius: 12px;
            padding: 16px;
        }

        .stat-number {
            font-size: 25px;
            font-weight: bold;
        }

        .stat-label {
            color: #888;
            font-size: 13px;
            margin-top: 4px;
        }

        .comment {
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 17px;
            margin-bottom: 13px;
        }

        .comment:last-child {
            margin-bottom: 0;
        }

        .comment-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .comment-name {
            font-weight: bold;
            font-size: 16px;
        }

        .comment-time {
            color: #999;
            font-size: 12px;
            margin-top: 4px;
        }

        .comment-text {
            margin: 14px 0;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .presence {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #f3f3f3;
            font-size: 12px;
            color: #666;
        }

        .empty {
            text-align: center;
            padding: 40px 15px;
            color: #999;
        }

        .loading {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        @media (max-width: 600px) {
            header .container {
                align-items: flex-start;
            }

            .comment-head {
                flex-direction: column;
            }

            .btn-delete {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         LOGIN
    ========================== -->

    <section id="loginSection">
        <div class="container">
            <div class="card login-card">

                <h2>Login Admin</h2>

                <p class="subtitle">
                    Dashboard Ucapan & Doa
                </p>

                <br>

                <div id="loginError" class="error hidden"></div>

                <input
                    type="email"
                    id="email"
                    placeholder="Email admin"
                    autocomplete="email"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >

                <button
                    id="loginButton"
                    class="btn-login"
                >
                    Login
                </button>

            </div>
        </div>
    </section>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <section id="dashboardSection" class="hidden">

        <header>
            <div class="container">

                <div>
                    <h1>Dashboard Ucapan</h1>
                    <div class="subtitle">
                        Ihsan & Syarifah
                    </div>
                </div>

                <button
                    id="logoutButton"
                    class="btn-logout"
                >
                    Logout
                </button>

            </div>
        </header>


        <main>
            <div class="container">

                <div id="dashboardMessage"></div>


                <!-- STATISTIK -->

                <div class="card">

                    <h2>Ringkasan</h2>

                    <div class="stats">

                        <div class="stat">
                            <div
                                id="totalComments"
                                class="stat-number"
                            >
                                0
                            </div>

                            <div class="stat-label">
                                Total Ucapan
                            </div>
                        </div>

                    </div>

                </div>


                <!-- KOMENTAR -->

                <div class="card">

                    <h2>Ucapan & Doa</h2>

                    <div
                        id="commentsList"
                        class="loading"
                    >
                        Memuat ucapan...
                    </div>

                </div>

            </div>
        </main>

    </section>


    <!-- =========================
         FIREBASE
    ========================== -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        import {
            getFirestore,
            collection,
            query,
            orderBy,
            getDocs,
            deleteDoc,
            doc
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        // =========================
        // FIREBASE CONFIG
        // =========================

        const firebaseConfig = {
            apiKey: "AIzaSyCxTII7lrjTrcqq-HBaOEHBz7uqg5Zl9T8",
            authDomain: "undangan-ihsan-syarifah.firebaseapp.com",
            projectId: "undangan-ihsan-syarifah",
            storageBucket: "undangan-ihsan-syarifah.firebasestorage.app",
            messagingSenderId: "877091672086",
            appId: "1:877091672086:web:9758a37f0c575cc1b3a537"
        };


        // =========================
        // INIT FIREBASE
        // =========================

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        // =========================
        // ADMIN UID
        // =========================

        const ADMIN_UID =
            "DwMXUyfyChMp85zsb9L5rFy6Tg53";


        // =========================
        // ELEMENTS
        // =========================

        const loginSection =
            document.getElementById("loginSection");

        const dashboardSection =
            document.getElementById("dashboardSection");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const logoutButton =
            document.getElementById("logoutButton");

        const loginError =
            document.getElementById("loginError");

        const dashboardMessage =
            document.getElementById("dashboardMessage");

        const commentsList =
            document.getElementById("commentsList");

        const totalComments =
            document.getElementById("totalComments");


        // =========================
        // LOGIN
        // =========================

        loginButton.addEventListener(
            "click",
            async () => {

                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                loginError.classList.add(
                    "hidden"
                );


                if (!email || !password) {

                    loginError.textContent =
                        "Email dan password wajib diisi.";

                    loginError.classList.remove(
                        "hidden"
                    );

                    return;
                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "Login...";


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                } catch (error) {

                    console.error(error);

                    loginError.textContent =
                        "Email atau password salah.";

                    loginError.classList.remove(
                        "hidden"
                    );

                } finally {

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";
                }

            }
        );


        // =========================
        // LOGOUT
        // =========================

        logoutButton.addEventListener(
            "click",
            async () => {

                await signOut(auth);

            }
        );


        // =========================
        // AUTH STATE
        // =========================

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    loginSection.classList.remove(
                        "hidden"
                    );

                    dashboardSection.classList.add(
                        "hidden"
                    );

                    return;
                }


                // Pastikan akun adalah admin

                if (user.uid !== ADMIN_UID) {

                    await signOut(auth);

                    loginError.textContent =
                        "Akun ini bukan akun admin.";

                    loginError.classList.remove(
                        "hidden"
                    );

                    return;
                }


                // Admin berhasil login

                loginSection.classList.add(
                    "hidden"
                );

                dashboardSection.classList.remove(
                    "hidden"
                );


                loadComments();

            }
        );


        // =========================
        // LOAD COMMENTS
        // =========================

        async function loadComments() {

            commentsList.innerHTML =
                '<div class="loading">Memuat ucapan...</div>';


            try {

                const commentsQuery =
                    query(
                        collection(db, "comments"),
                        orderBy(
                            "createdAt",
                            "desc"
                        )
                    );


                const snapshot =
                    await getDocs(
                        commentsQuery
                    );


                totalComments.textContent =
                    snapshot.size;


                if (snapshot.empty) {

                    commentsList.innerHTML =
                        '<div class="empty">Belum ada ucapan.</div>';

                    return;
                }


                commentsList.innerHTML = "";


                snapshot.forEach(
                    (commentSnapshot) => {

                        const data =
                            commentSnapshot.data();

                        const id =
                            commentSnapshot.id;


                        const commentElement =
                            createCommentElement(
                                id,
                                data
                            );


                        commentsList.appendChild(
                            commentElement
                        );

                    }
                );


            } catch (error) {

                console.error(error);

                commentsList.innerHTML =
                    '<div class="error">Gagal memuat ucapan.</div>';

            }

        }


        // =========================
        // CREATE COMMENT ELEMENT
        // =========================

        function createCommentElement(
            id,
            data
        ) {

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "comment";


            const head =
                document.createElement("div");

            head.className =
                "comment-head";


            const info =
                document.createElement("div");


            const name =
                document.createElement("div");

            name.className =
                "comment-name";

            name.textContent =
                data.name || "Tamu";


            const time =
                document.createElement("div");

            time.className =
                "comment-time";

            time.textContent =
                formatDate(
                    data.createdAt
                );


            info.appendChild(name);

            info.appendChild(time);


            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "btn-delete";

            deleteButton.textContent =
                "Hapus";


            deleteButton.addEventListener(
                "click",
                () => deleteComment(
                    id,
                    wrapper
                )
            );


            head.appendChild(info);

            head.appendChild(
                deleteButton
            );


            const text =
                document.createElement("div");

            text.className =
                "comment-text";

            text.textContent =
                data.comment || "";


            const presence =
                document.createElement("span");

            presence.className =
                "presence";

            presence.textContent =
                data.presence
                    ? "Hadir"
                    : "Tidak hadir";


            wrapper.appendChild(head);

            wrapper.appendChild(text);

            wrapper.appendChild(presence);


            return wrapper;

        }


        // =========================
        // DELETE COMMENT
        // =========================

        async function deleteComment(
            id,
            element
        ) {

            const confirmed =
                confirm(
                    "Yakin ingin menghapus ucapan ini?"
                );


            if (!confirmed) {
                return;
            }


            try {

                await deleteDoc(
                    doc(
                        db,
                        "comments",
                        id
                    )
                );


                element.remove();


                const currentTotal =
                    Number(
                        totalComments.textContent
                    );


                totalComments.textContent =
                    Math.max(
                        0,
                        currentTotal - 1
                    );


                showMessage(
                    "Ucapan berhasil dihapus.",
                    "success"
                );


            } catch (error) {

                console.error(error);

                showMessage(
                    "Gagal menghapus ucapan.",
                    "error"
                );

            }

        }


        // =========================
        // MESSAGE
        // =========================

        function showMessage(
            message,
            type
        ) {

            dashboardMessage.innerHTML =
                `<div class="${type}">
                    ${message}
                </div>`;


            setTimeout(
                () => {

                    dashboardMessage.innerHTML =
                        "";

                },
                3000
            );

        }


        // =========================
        // DATE FORMAT
        // =========================

        function formatDate(
            timestamp
        ) {

            if (
                !timestamp ||
                !timestamp.toDate
            ) {

                return "Baru saja";

            }


            const date =
                timestamp.toDate();


            return date.toLocaleString(
                "id-ID",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }

    </script>

</body>
</html>
