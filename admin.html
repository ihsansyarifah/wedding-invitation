function showMessage(text, type = "success") {

    message.innerHTML = "";

    const div =
        document.createElement("div");

    div.className =
        type === "error"
            ? "error"
            : "success";

    div.textContent = text;

    message.appendChild(div);

}


/* =========================================================
   WORKER REQUEST
   ========================================================= */

async function workerRequest(
    method = "GET",
    body = null
) {

    const user = auth.currentUser;

    if (!user) {
        throw new Error(
            "Sesi admin belum tersedia."
        );
    }

    const token =
        await user.getIdToken(true);

    const options = {

        method,

        headers: {

            "Authorization":
                "Bearer " + token,

            "Accept":
                "application/json"

        }

    };


    if (body !== null) {

        options.headers["Content-Type"] =
            "application/json";

        options.body =
            JSON.stringify(body);

    }


    const response =
        await fetch(
            WORKER_URL + "/index",
            options
        );


    /*
       PENTING:
       Jangan langsung response.json().
       Kita baca text dulu supaya kalau Worker
       mengembalikan teks biasa, kita bisa melihat
       error sebenarnya.
    */

    const raw =
        await response.text();


    let data;

    try {

        data =
            JSON.parse(raw);

    } catch (error) {

        throw new Error(
            "Worker mengembalikan jawaban yang bukan JSON: " +
            raw.slice(0, 300)
        );

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            data.message ||
            "Worker gagal memproses permintaan."
        );

    }


    return data;

}

    if (!data.success) {

    currentContent =

       Nilai form diisi dari teks yang ada.

}

        } finally {

);


/* =========================================================
   AUTH STATE
   ========================================================= */

onAuthStateChanged(
    auth,
    async function(user) {

        if (!user) {

            loginPage.classList.remove(
                "hidden"
            );

            adminPage.classList.add(
                "hidden"
            );

            return;

        }


        if (user.uid !== ADMIN_UID) {

            await signOut(auth);

            loginError.textContent =
                "Akun ini bukan akun admin.";

            loginError.classList.remove(
                "hidden"
            );

            return;

        }


        loginPage.classList.add(
            "hidden"
        );

        adminPage.classList.remove(
            "hidden"
        );

        adminEmail.textContent =
            user.email || "";


        try {

            await loadIndex();

        } catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }
);

/* =========================================================

   ========================================================= */

async function loadComments() {

    const list =
        document.getElementById(
            "comments-list"
        );

    list.textContent =
        "Memuat komentar...";


    try {

        const q =
            query(
                collection(
                    db,
                    "comments"
                ),
                where(
                    "invitationId",
                    "==",
                    "ihsan-syarifah"
                )
            );


        const snapshot =
            await getDocs(q);


        if (snapshot.empty) {

            list.textContent =
                "Belum ada komentar.";

            return;

        }


        const comments =
            snapshot.docs.map(
                function(item) {

                    return {

                        id: item.id,

                        ...item.data()

                    };

                }
            );


        comments.sort(
            function(a,b) {

                const aTime =
                    a.createdAt?.seconds || 0;

                const bTime =
                    b.createdAt?.seconds || 0;

                return bTime - aTime;

            }
        );


        list.innerHTML = "";


        comments.forEach(
            function(comment) {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "comment";


                const name =
                    document.createElement(
                        "strong"
                    );

                name.textContent =
                    comment.name || "Tanpa nama";


                const text =
                    document.createElement(
                        "div"
                    );

                text.textContent =
                    comment.comment || "";


                const small =
                    document.createElement(
                        "small"
                    );

                small.textContent =
                    comment.presence
                        ? "Hadir"
                        : "Tidak hadir";


                const button =
                    document.createElement(
                        "button"
                    );

                button.textContent =
                    "Hapus";

                button.style.marginTop =
                    "10px";

                button.style.border =
                    "1px solid #d8c7bc";

                button.style.background =
                    "#fff";

                button.style.borderRadius =
                    "999px";

                button.style.padding =
                    "7px 13px";

                button.style.cursor =
                    "pointer";


                button.addEventListener(
                    "click",
                    async function() {

                        if (
                            !confirm(
                                "Hapus komentar ini?"
                            )
                        ) {
                            return;
                        }


                        try {

                            await deleteDoc(
                                doc(
                                    db,
                                    "comments",
                                    comment.id
                                )
                            );


                            await loadComments();

                        } catch (error) {

                            showMessage(
                                error.message,
                                "error"
                            );

                        }

                    }
                );


                div.appendChild(name);

                div.appendChild(text);

                div.appendChild(
                    document.createElement("br")
                );

                div.appendChild(small);

                div.appendChild(
                    document.createElement("br")
                );

                div.appendChild(button);

                list.appendChild(div);

            }
        );


    } catch (error) {

        list.textContent =
            error.message;

    }

}

</script>

</body>
</html>
