<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Ucapan — Ihsan & Syarifah</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f3ef;color:#3f312b}
button,input{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.wrap{width:min(100% - 28px,1100px);margin:auto}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #eadfd7}
.top .wrap{display:flex;justify-content:space-between;align-items:center;padding:15px 0;gap:12px}
.brand h1{font-size:21px;margin:0}
.brand p{font-size:12px;color:#8c7d75;margin:4px 0 0}
.btn{border-radius:12px;padding:10px 14px;background:#6b4a3c;color:#fff}
.btn.light{background:#eee5df;color:#49362e}
.btn.danger{background:#c9534f}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 28px #5b3e3110;margin:18px 0}
.card h2{font-size:18px;margin:0 0 14px}
.field{margin:0 0 13px}
.field label{display:block;font-size:12px;font-weight:700;margin:0 0 6px;color:#6b5a51}
.field input{width:100%;border:1px solid #dfd4cd;border-radius:11px;padding:10px 11px;background:#fff;color:#3f312b}
.notice{padding:11px 13px;border-radius:11px;margin-bottom:14px;font-size:13px}
.ok{background:#edf8ef;color:#2e7d38}
.err{background:#fff0f0;color:#b52e2e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f7f3ef;border-radius:13px;padding:14px}
.num{font-size:25px;font-weight:700}
.lbl{font-size:12px;color:#8c7d75;margin-top:4px}
.comment{border:1px solid #eee1da;border-radius:13px;padding:14px;margin:10px 0}
.comment-head{display:flex;justify-content:space-between;gap:10px}
.comment-name{font-weight:700}
.muted{font-size:12px;color:#999}
.comment-text{white-space:pre-wrap;line-height:1.55;margin:10px 0}
.presence{font-size:12px;padding:4px 8px;border-radius:99px;background:#f0ece8}
.small{font-size:12px;color:#8c7d75}
.login{max-width:430px;margin:70px auto}
@media(max-width:760px){
  .stats{grid-template-columns:1fr}
  .top .wrap{align-items:flex-start}
}
</style>
</head>
<body>
<section id="login" class="login wrap">
 <div class="card">
  <h2>Login Admin</h2><p class="small">Kelola ucapan sekaligus isi & tampilan undangan.</p>
  <div id="loginMsg"></div>
  <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div>
  <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
  <button id="loginBtn" class="btn" style="width:100%">Login</button><p class="small" style="margin:10px 0 0">Jika login gagal, kode Firebase asli akan ditampilkan supaya penyebabnya bisa kita perbaiki tepat.</p>
 </div>
</section>

<section id="app" class="hidden">
<header class="top"><div class="wrap"><div class="brand"><h1>Dashboard Ucapan</h1><p>Ihsan &amp; Syarifah</p></div><button id="logout" class="btn light">Logout</button></div></header>
<main class="wrap">
 <div id="msg"></div>
 <section>
  <div class="card"><h2>Ringkasan Kehadiran</h2><div class="stats">
   <div class="stat"><div class="num" id="total">0</div><div class="lbl">Total Ucapan</div></div>
   <div class="stat"><div class="num" id="hadir">0</div><div class="lbl">Hadir</div></div>
   <div class="stat"><div class="num" id="tidak">0</div><div class="lbl">Tidak Hadir</div></div>
  </div></div>
  <div class="card"><h2>Ucapan &amp; Doa</h2><div id="comments">Memuat...</div></div>
 </section>
</main>
</section>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import {getFirestore,collection,query,orderBy,getDocs,deleteDoc,doc} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyCxTII7lrTrcqq-HBaOEHBz7uqg5Zl9T8',authDomain:'undangan-ihsan-syarifah.firebaseapp.com',projectId:'undangan-ihsan-syarifah',storageBucket:'undangan-ihsan-syarifah.firebasestorage.app',messagingSenderId:'877091672086',appId:'1:877091672086:web:9758a37f0c575cc1b3a537'};
const ADMIN_UID='DwMXUyfyChMp85zsb9L5rFy6Tg53';

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

function esc(s){
  return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}
function loginMsg(t,ok=false){
  $('loginMsg').innerHTML='<div class="notice '+(ok?'ok':'err')+'">'+t+'</div>';
}
function msg(t,ok=true){
  $('msg').innerHTML='<div class="notice '+(ok?'ok':'err')+'">'+t+'</div>';
  setTimeout(()=>$('msg').innerHTML='',4000);
}

$('loginBtn').onclick=async()=>{
  const email=$('email').value.trim();
  const password=$('password').value;
  if(!email||!password){loginMsg('Email dan password wajib diisi.');return}
  $('loginBtn').disabled=true;
  $('loginBtn').textContent='Memeriksa...';
  try{
    await signInWithEmailAndPassword(auth,email,password);
  }catch(e){
    console.error('Firebase Login Error:',e);
    const code=e?.code||'';
    const messages={
      'auth/invalid-credential':'Email atau password tidak cocok.',
      'auth/invalid-login-credentials':'Email atau password tidak cocok.',
      'auth/wrong-password':'Password salah.',
      'auth/user-not-found':'Akun admin tidak ditemukan.',
      'auth/invalid-email':'Format email tidak valid.',
      'auth/user-disabled':'Akun admin sedang dinonaktifkan.',
      'auth/too-many-requests':'Terlalu banyak percobaan login. Tunggu beberapa saat.',
      'auth/network-request-failed':'Koneksi ke Firebase gagal.',
      'auth/operation-not-allowed':'Login Email/Password belum diaktifkan.',
      'auth/configuration-not-found':'Konfigurasi Firebase Authentication belum aktif.',
      'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'API key Firebase ditolak.'
    };
    loginMsg((messages[code]||'Login gagal.')+'<br><small>Kode: <b>'+esc(code||'tidak diketahui')+'</b></small>');
  }finally{
    $('loginBtn').disabled=false;
    $('loginBtn').textContent='Login';
  }
};

$('logout').onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
  if(!user){
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
    return;
  }
  if(user.uid!==ADMIN_UID){
    await signOut(auth);
    loginMsg('Akun ini bukan akun admin.');
    return;
  }
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  loadComments();
});

async function loadComments(){
  $('comments').textContent='Memuat...';
  try{
    const q=query(collection(db,'comments'),orderBy('createdAt','desc'));
    const snap=await getDocs(q);
    let hadir=0,tidak=0,html='';
    snap.forEach(d=>{
      const x=d.data();
      if(x.presence) hadir++; else tidak++;
      html+='<div class="comment">'+
        '<div class="comment-head"><div><div class="comment-name">'+esc(x.name||'Tamu')+'</div>'+
        '<div class="muted">'+date(x.createdAt)+'</div></div>'+
        '<button class="btn danger" data-del="'+esc(d.id)+'">Hapus</button></div>'+
        '<div class="comment-text">'+esc(x.comment||'')+'</div>'+
        '<span class="presence">'+(x.presence?'Hadir':'Tidak hadir')+'</span>'+
        '</div>';
    });
    $('total').textContent=snap.size;
    $('hadir').textContent=hadir;
    $('tidak').textContent=tidak;
    $('comments').innerHTML=html||'<div class="small">Belum ada ucapan.</div>';

    document.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick=async()=>{
        if(!confirm('Hapus ucapan ini?')) return;
        try{
          await deleteDoc(doc(db,'comments',b.dataset.del));
          msg('Ucapan berhasil dihapus.');
          loadComments();
        }catch(e){
          console.error(e);
          msg('Gagal menghapus: '+(e?.message||e),false);
        }
      };
    });
  }catch(e){
    console.error(e);
    $('comments').innerHTML='<div class="notice err">Gagal memuat ucapan.<br><small>'+esc(e?.message||e)+'</small></div>';
  }
}
function date(ts){
  try{
    const d=ts?.toDate?ts.toDate():new Date(ts);
    return d.toLocaleString('id-ID');
  }catch{return ''}
}
</script>
</body></html>
