/* =========================================================
   RESPONSE HELPER
   ========================================================= */

async function readResponse(response){

    const text =
        await response.text();

    let data = null;

    try{

        data =
            text ? JSON.parse(text) : null;

    }catch(error){

        throw new Error(
            "Worker mengembalikan response yang bukan JSON: " +
            text.slice(0,300)
        );

    }

    if(!response.ok){

        throw new Error(
            data?.error ||
            data?.message ||
            "Request gagal."
        );

    }

    return data;

}


/* =========================================================
   WORKER
   ========================================================= */

async function workerRequest(
    method = "GET",
    body = null
){

    const user =
        auth.currentUser;

    if(!user){

        throw new Error(
            "Sesi admin belum aktif."
        );

    }

    if(user.uid !== ADMIN_UID){

        throw new Error(
            "Akun ini bukan admin yang diizinkan."
        );

    }

    const token =
        await user.getIdToken(true);


    const options = {

        method,

        headers: {

            "Authorization":
                "Bearer " + token,

            "Accept":
                "application/json"

        }

    };


    if(body !== null){

        options.headers[
            "Content-Type"
        ] =
            "application/json";

        options.body =
            JSON.stringify(body);

    }


    const response =
        await fetch(
            WORKER_INDEX_URL,
            options
        );


    return readResponse(response);

}

function cleanText(text){

    return String(text || "")
        .replace(/\s+/g," ")
        .trim();

}


function escapeRegExp(text){

    return text.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
    );

}


/* =========================================================
   PARSE INDEX
   ========================================================= */

function parseInvitationHTML(html){

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    /* nama pendek */

    const shortNames =
        [...doc.querySelectorAll(
            ".welcome-name-line"
        )];

    const groomShort =
        cleanText(
            shortNames[0]?.textContent
        );

    const brideShort =
        cleanText(
            shortNames[1]?.textContent
        );


    /* nama lengkap */

    const fullNames =
        [...doc.querySelectorAll(
            "#bride .person-name"
        )];

    const groomName =
        cleanText(
            fullNames[0]?.textContent
        );

    const brideName =
        cleanText(
            fullNames[1]?.textContent
        );


    /* orang tua */

    const groomBlock =
        fullNames[0]
        ?.closest(".pb-2");

    const brideBlock =
        fullNames[1]
        ?.closest(".pb-2");


    const groomParents =
        groomBlock
        ? [...groomBlock.querySelectorAll(
            "p.mb-0"
        )]
        : [];


    const brideParents =
        brideBlock
        ? [...brideBlock.querySelectorAll(
            "p.mb-0"
        )]
        : [];


    const groomFather =
        cleanText(
            groomParents[0]?.textContent
        );

    const groomMother =
        cleanText(
            groomParents[2]?.textContent
        );

    const brideFather =
        cleanText(
            brideParents[0]?.textContent
        );

    const brideMother =
        cleanText(
            brideParents[2]?.textContent
        );


    /* tanggal */

    const rawTime =
        doc.body.dataset.time || "";

    let weddingDate =
        "";

    let akadTime =
        "";


    if(rawTime){

        const match =
            rawTime.match(
                /^(\d{4}-\d{2}-\d{2})\s+(\d{2}):(\d{2})/
            );

        if(match){

            weddingDate =
                match[1];

            akadTime =
                match[2] +
                ":" +
                match[3];

        }

    }


    if(!weddingDate){

        const dateText =
            cleanText(
                doc.querySelector(
                    "#home p[style*='1.15rem']"
                )?.textContent
            );

        const parsed =
            parseIndonesianDate(
                dateText
            );

        weddingDate =
            parsed || "";

    }


    /* waktu resepsi */

    const weddingCards =
        [...doc.querySelectorAll(
            "#wedding-date .section-card"
        )];


    let receptionTime =
        "";


    if(weddingCards[1]){

        const ps =
            [...weddingCards[1].querySelectorAll(
                "p"
            )];

        const timeText =
            cleanText(
                ps[1]?.textContent
            );

        receptionTime =
            timeText
            .replace(/^Pukul\s*/i,"")
            .replace(/\s*WIB$/i,"");

    }


    /* lokasi */

    const locationArea =
        doc.querySelector(
            "#wedding-date .mt-4"
        );


    const location =
        cleanText(
            locationArea?.querySelector(
                "small"
            )?.textContent
        );


    const maps =
        locationArea?.querySelector(
            "a"
        )?.getAttribute("href") || "";


    /* kisah */

    const storyBlocks =
        [...doc.querySelectorAll(
            "#love-story-page .story-block"
        )];


    function getStory(index){

        const block =
            storyBlocks[index];

        if(!block){
            return "";
        }

        const paragraphs =
            [...block.querySelectorAll("p")];

        return paragraphs
            .map(p =>
                cleanText(
                    p.innerHTML
                        .replace(/<br\s*\/?>/gi,"\n")
                        .replace(/<[^>]+>/g,"")
                )
            )
            .filter(Boolean)
            .join("\n\n");

    }


    /* gift */

    const giftCards =
        [...doc.querySelectorAll(
            "#wedding-date ~ section .gift-card"
        )];


    let gopay = "";
    let dana = "";
    let giftAddress = "";
    let giftMaps = "";


    const allGiftCards =
        [...doc.querySelectorAll(
            ".gift-card"
        )];


    for(const card of allGiftCards){

        const text =
            cleanText(
                card.textContent
            );


        if(
            text.includes("GoPay") &&
            text.includes("DANA")
        ){

            const ps =
                [...card.querySelectorAll("p")];

            for(const p of ps){

                const t =
                    cleanText(
                        p.textContent
                    );

                if(t.startsWith("GoPay:")){

                    gopay =
                        t
                            .replace(
                                /^GoPay:\s*/i,
                                ""
                            );

                }

                if(t.startsWith("DANA:")){

                    dana =
                        t
                            .replace(
                                /^DANA:\s*/i,
                                ""
                            );

                }

            }

        }


        if(
            text.includes("Kirim Kado")
        ){

            giftAddress =
                cleanText(
                    card.querySelector(
                        "p.m-0"
                    )?.textContent
                );

            giftMaps =
                card.querySelector(
                    "a"
                )?.getAttribute("href") || "";

        }

    }


    return {

        groomName,
        brideName,
        groomShort,
        brideShort,

        groomFather,
        groomMother,
        brideFather,
        brideMother,

        weddingDate,
        akadTime,
        receptionTime,

        location,
        maps,

        story2019:
            getStory(0),

        story2022:
            getStory(1),

        story2025:
            getStory(2),

        story2026:
            getStory(3),

        gopay,
        dana,
        giftAddress,
        giftMaps

    };

}


/* =========================================================
   DATE PARSER
   ========================================================= */

function parseIndonesianDate(text){

    const months = {

        januari:"01",
        februari:"02",
        maret:"03",
        april:"04",
        mei:"05",
        juni:"06",
        juli:"07",
        agustus:"08",
        september:"09",
        oktober:"10",
        november:"11",
        desember:"12"

    };


    const match =
        text.match(
            /(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/
        );


    if(!match){
        return "";
    }


    const day =
        String(match[1])
            .padStart(2,"0");

    const month =
        months[
            match[2].toLowerCase()
        ];


    if(!month){
        return "";
    }


    return (
        match[3] +
        "-" +
        month +
        "-" +
        day
    );

}

/* =========================================================
   HTML HELPERS
   ========================================================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


function textToHTML(text){

    return escapeHTML(text)
        .replace(/\r?\n/g,"<br>");

}


function replaceElementText(
    html,
    selector,
    value,
    occurrence = 0
){

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    const elements =
        doc.querySelectorAll(
            selector
        );


    if(elements[occurrence]){

        elements[occurrence].textContent =
            value || "";

    }


    return (
        "<!doctype html>\n" +
        doc.documentElement.outerHTML
    );

}


/* =========================================================
   UPDATE HTML
   ========================================================= */

function updateHTML(html){

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    const value = id =>
        document.getElementById(id)?.value.trim() || "";


    const groomName =
        value("groom-name");

    const brideName =
        value("bride-name");

    const groomShort =
        value("groom-short");

    const brideShort =
        value("bride-short");

    const groomFather =
        value("groom-father");

    const groomMother =
        value("groom-mother");

    const brideFather =
        value("bride-father");

    const brideMother =
        value("bride-mother");

    const weddingDate =
        value("wedding-date");

    const akadTime =
        value("akad-time");

    const receptionTime =
        value("reception-time");

    const location =
        value("location");

    const maps =
        value("maps");

    const story2019 =
        value("story-2019");

    const story2022 =
        value("story-2022");

    const story2025 =
        value("story-2025");

    const story2026 =
        value("story-2026");

    const gopay =
        value("gopay");

    const dana =
        value("dana");

    const giftAddress =
        value("gift-address");

    const giftMaps =
        value("gift-maps");


    /* =====================================================
       NAMA PENDEK
       ===================================================== */

    const shortElements =
        doc.querySelectorAll(
            ".welcome-name-line"
        );


    if(shortElements[0])
        shortElements[0].textContent =
            groomShort;


    if(shortElements[1])
        shortElements[1].textContent =
            brideShort;


    /* =====================================================
       NAMA LENGKAP
       ===================================================== */

    const fullNames =
        doc.querySelectorAll(
            "#bride .person-name"
        );


    if(fullNames[0])
        fullNames[0].textContent =
            groomName;


    if(fullNames[1])
        fullNames[1].textContent =
            brideName;


    /* =====================================================
       ALT FOTO
       ===================================================== */

    const groomPhoto =
        doc.querySelector(
            "#bride img.person-photo"
        );

    const bridePhoto =
        doc.querySelectorAll(
            "#bride img.person-photo"
        )[1];


    if(groomPhoto)
        groomPhoto.alt =
            groomName;


    if(bridePhoto)
        bridePhoto.alt =
            brideName;


    /* =====================================================
       NAMA COVER
       ===================================================== */

    const coverTitles =
        doc.querySelectorAll(
            ".cover-title"
        );


    coverTitles.forEach(el => {

        el.textContent =
            groomShort +
            " & " +
            brideShort;

    });


    /* =====================================================
       ORANG TUA
       ===================================================== */

    const brideBlocks =
        doc.querySelectorAll(
            "#bride .pb-2"
        );


    if(brideBlocks[0]){

        const ps =
            brideBlocks[0]
                .querySelectorAll(
                    "p.mb-0"
                );

        if(ps[0])
            ps[0].textContent =
                groomFather;

        if(ps[2])
            ps[2].textContent =
                groomMother;

    }


    if(brideBlocks[1]){

        const ps =
            brideBlocks[1]
                .querySelectorAll(
                    "p.mb-0"
                );

        if(ps[0])
            ps[0].textContent =
                brideFather;

        if(ps[2])
            ps[2].textContent =
                brideMother;

    }


    /* =====================================================
       TANGGAL
       ===================================================== */

    const dateObj =
        new Date(
            weddingDate +
            "T00:00:00"
        );


    const weekdayNames = [

        "Minggu",
        "Senin",
        "Selasa",
        "Rabu",
        "Kamis",
        "Jumat",
        "Sabtu"

    ];


    const monthNames = [

        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember"

    ];


    let displayDate =
        "";


    if(!isNaN(dateObj.getTime())){

        displayDate =
            weekdayNames[
                dateObj.getDay()
            ] +
            ", " +
            dateObj.getDate() +
            " " +
            monthNames[
                dateObj.getMonth()
            ] +
            " " +
            dateObj.getFullYear();

    }


    const displayDateUpper =
        displayDate.toUpperCase();


    /* welcome */

    const welcomeDate =
        doc.querySelector(
            ".welcome-date"
        );


    if(welcomeDate)
        welcomeDate.textContent =
            displayDateUpper;


    /* home */

    const home =
        doc.querySelector(
            "#home"
        );


    if(home){

        const ps =
            home.querySelectorAll(
                "p"
            );


        ps.forEach(p => {

            const t =
                p.textContent.trim();


            if(
                t === "Minggu" ||
                t === "Senin" ||
                t === "Selasa" ||
                t === "Rabu" ||
                t === "Kamis" ||
                t === "Jumat" ||
                t === "Sabtu"
            ){

                p.textContent =
                    weekdayNames[
                        dateObj.getDay()
                    ];

            }


            if(
                /^\d{1,2}\s+\w+\s+\d{4}$/.test(t)
            ){

                p.textContent =
                    displayDate
                        .replace(
                            /^[^,]+,\s*/,
                            ""
                        );

            }

        });

    }


    /* desktop */

    const desktop =
        doc.querySelector(
            ".desktop-cover-content"
        );


    if(desktop){

        const p =
            desktop.querySelector(
                "p.m-0"
            );

        if(p)
            p.textContent =
                displayDate;

    }


    /* =====================================================
       BODY COUNTDOWN
       ===================================================== */

    if(weddingDate){

        const cleanAkad =
            akadTime || "08:00";


        doc.body.dataset.time =
            weddingDate +
            " " +
            cleanAkad +
            ":00";

    }


    /* =====================================================
       WEDDING CARDS
       ===================================================== */

    const weddingCards =
        doc.querySelectorAll(
            "#wedding-date .section-card"
        );


    if(weddingCards[0]){

        const ps =
            weddingCards[0]
                .querySelectorAll("p");

        if(ps[0])
            ps[0].textContent =
                displayDate;

        if(ps[1])
            ps[1].textContent =
                "Pukul " +
                akadTime +
                " WIB";

    }


    if(weddingCards[1]){

        const ps =
            weddingCards[1]
                .querySelectorAll("p");

        if(ps[0])
            ps[0].textContent =
                displayDate;

        if(ps[1])
            ps[1].textContent =
                "Pukul " +
                receptionTime +
                " WIB";

    }


    /* =====================================================
       LOKASI
       ===================================================== */

    const locationArea =
        doc.querySelector(
            "#wedding-date .mt-4"
        );


    if(locationArea){

        const link =
            locationArea.querySelector(
                "a"
            );

        const small =
            locationArea.querySelector(
                "small"
            );


        if(link)
            link.href =
                maps;


        if(small)
            small.textContent =
                location;

    }


    /* =====================================================
       KISAH
       ===================================================== */

    const storyBlocks =
        doc.querySelectorAll(
            "#love-story-page .story-block"
        );


    const stories = [

        story2019,
        story2022,
        story2025,
        story2026

    ];


    stories.forEach(
        (story,index) => {

            const block =
                storyBlocks[index];


            if(!block)
                return;


            const paragraphs =
                [...block.querySelectorAll(
                    "p"
                )];


            if(!story){

                paragraphs.forEach(
                    p => p.remove()
                );

                return;

            }


            const lines =
                story
                    .split(/\n\s*\n/)
                    .filter(Boolean);


            paragraphs.forEach(
                p => p.remove()
            );


            lines.forEach(
                (part,partIndex) => {

                    const p =
                        doc.createElement(
                            "p"
                        );


                    if(
                        index === 1 &&
                        partIndex ===
                        lines.length - 1
                    ){

                        p.className =
                            "story-emphasis";

                    }


                    p.innerHTML =
                        textToHTML(
                            part
                        );


                    block.insertBefore(
                        p,
                        block.querySelector(
                            ".story-actions"
                        ) || null
                    );

                }
            );

        }
    );


    /* =====================================================
       GOPAY + DANA
       ===================================================== */

    const giftCards =
        doc.querySelectorAll(
            ".gift-card"
        );


    giftCards.forEach(card => {

        const text =
            card.textContent;


        if(
            text.includes("GoPay") &&
            text.includes("DANA")
        ){

            const ps =
                card.querySelectorAll(
                    "p"
                );


            ps.forEach(p => {

                const t =
                    p.textContent.trim();


                if(
                    t.startsWith("GoPay:")
                ){

                    p.textContent =
                        "GoPay: " +
                        gopay;

                }


                if(
                    t.startsWith("DANA:")
                ){

                    p.textContent =
                        "DANA: " +
                        dana;

                }

            });

        }


        if(
            text.includes("Kirim Kado")
        ){

            const p =
                card.querySelector(
                    "p.m-0"
                );


            const a =
                card.querySelector(
                    "a"
                );


            if(p)
                p.textContent =
                    giftAddress;


            if(a)
                a.href =
                    giftMaps;

        }

    });


    /* =====================================================
       CALENDAR
       ===================================================== */

    const calendar =
        doc.getElementById(
            "calendar-button"
        );


    if(calendar && weddingDate){

        const compact =
            weddingDate.replace(
                /-/g,
                ""
            );


        const title =
            encodeURIComponent(
                "The Wedding of " +
                groomShort +
                " & " +
                brideShort
            );


        const locationEncoded =
            encodeURIComponent(
                location
            );


        calendar.href =
            "https://calendar.google.com/calendar/render" +
            "?action=TEMPLATE" +
            "&text=" +
            title +
            "&dates=" +
            compact +
            "T010000Z/" +
            compact +
            "T070000Z" +
            "&location=" +
            locationEncoded +
            "&ctz=Asia%2FJakarta";

    }


    return (
        "<!doctype html>\n" +
        doc.documentElement.outerHTML
    );

}


/* =========================================================
   LOAD INDEX
   ========================================================= */

async function loadInvitation(){

    saveStatus.textContent =
        "Mengambil data undangan...";


    try{

        const data =
            await workerRequest(
                "GET"
            );


        currentIndexHTML =
            data.content || "";

        currentSHA =
            data.sha || "";


        if(!currentIndexHTML){

            throw new Error(
                "index.html kosong dari Worker."
            );

        }


        const invitation =
            parseInvitationHTML(
                currentIndexHTML
            );


        fillForm(
            invitation
        );


        saveStatus.textContent =
            "Data undangan berhasil dimuat.";

    }catch(error){

        console.error(error);

        saveStatus.textContent =
            "Gagal memuat data.";

        showError(
            error.message
        );

    }

}


/* =========================================================
   SAVE
   ========================================================= */

async function saveInvitation(){

    if(
        !currentIndexHTML ||
        !currentSHA
    ){

        showError(
            "Data index.html belum berhasil dimuat."
        );

        return;

    }


    saveBtn.disabled =
        true;

    saveBtn.textContent =
        "⏳ Menyimpan...";

    saveStatus.textContent =
        "Mengirim perubahan ke GitHub...";


    try{

        const updatedHTML =
            updateHTML(
                currentIndexHTML
            );


        const result =
            await workerRequest(
                "PUT",
                {

                    content:
                        updatedHTML,

                    sha:
                        currentSHA

                }
            );


        currentIndexHTML =
            updatedHTML;


        if(result.sha)
            currentSHA =
                result.sha;


        saveStatus.textContent =
            "✅ Berhasil disimpan ke GitHub.";


        showSuccess(
            "Perubahan berhasil dikirim ke GitHub. GitHub Actions akan membangun ulang undangan."
        );


    }catch(error){

        console.error(error);

        saveStatus.textContent =
            "❌ Gagal menyimpan.";

        showError(
            error.message
        );

    }finally{

        saveBtn.disabled =
            false;

        saveBtn.textContent =
            "💾 Simpan Perubahan";

    }

}

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            loginSection.classList.remove(
                "hidden"
            );

            adminSection.classList.add(
                "hidden"
            );

            adminEmail.textContent =
                "";

            return;

        }


        if(user.uid !== ADMIN_UID){

            await signOut(auth);

            showError(
                "Akun ini bukan akun admin yang diizinkan."
            );

            return;

        }


        loginSection.classList.add(
            "hidden"
        );

        adminSection.classList.remove(
            "hidden"
        );

        adminEmail.textContent =
            user.email || "Admin";


        /*
         * PENTING:
         * load baru dilakukan SETELAH login.
         * Jadi tidak ada lagi request /index tanpa token.
         */

        await loadInvitation();

    }
);

/* =========================================================
   COMMENTS
   ========================================================= */

async function loadComments(){

    const list =
        document.getElementById(
            "comments-list"
        );

    const stats =
        document.getElementById(
            "comment-stats"
        );


    list.innerHTML =
        `<div class="loading">
            Memuat komentar...
        </div>`;


    try{

        const q =
            query(
                collection(
                    db,
                    "comments"
                ),
                where(
                    "invitationId",
                    "==",
                    "ihsan-syarifah"
                )
            );


        const snapshot =
            await getDocs(q);


        const comments =
            snapshot.docs
                .map(d => ({
                    id:d.id,
                    ...d.data()
                }))
                .sort(
                    (a,b) =>
                        getMillis(b.createdAt) -
                        getMillis(a.createdAt)
                );


        stats.textContent =
            comments.length +
            " komentar";


        if(!comments.length){

            list.innerHTML =
                `<div class="loading">
                    Belum ada komentar.
                </div>`;

            return;

        }


        list.innerHTML =
            comments
                .map(renderComment)
                .join("");


        list.querySelectorAll(
            "[data-delete]"
        ).forEach(
            button => {

                button.addEventListener(
                    "click",
                    async () => {

                        const id =
                            button.dataset.delete;


                        if(
                            !confirm(
                                "Hapus komentar ini?"
                            )
                        ){

                            return;

                        }


                        try{

                            await deleteDoc(
                                doc(
                                    db,
                                    "comments",
                                    id
                                )
                            );


                            await loadComments();


                        }catch(error){

                            showError(
                                "Komentar tidak bisa dihapus: " +
                                error.message
                            );

                        }

                    }
                );

            }
        );


    }catch(error){

        console.error(error);

        list.innerHTML =
            `<div class="loading">
                Gagal memuat komentar.
            </div>`;

        showError(
            error.message
        );

    }

}


function getMillis(value){

    if(!value)
        return 0;


    if(
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }


    if(
        value.seconds
    ){

        return value.seconds * 1000;

    }


    return 0;

}


function renderComment(comment){

    const name =
        escapeHTML(
            comment.name ||
            "Tanpa nama"
        );


    const text =
        escapeHTML(
            comment.comment ||
            ""
        );


    const presence =
        comment.presence === true
            ? "✅ Datang"
            : comment.presence === false
                ? "❌ Berhalangan"
                : "";


    return `
        <div class="comment-card">

            <div class="d-flex justify-content-between gap-3">

                <div>

                    <div class="comment-name">
                        ${name}
                    </div>

                    ${
                        presence
                            ? `<div class="small text-secondary">
                                ${presence}
                               </div>`
                            : ""
                    }

                </div>

                <button
                    type="button"
                    class="btn btn-sm btn-outline-danger rounded-pill"
                    data-delete="${escapeHTML(comment.id)}"
                >
                    Hapus
                </button>

            </div>

            <div class="comment-text">
                ${text}
            </div>

        </div>
    `;

}
