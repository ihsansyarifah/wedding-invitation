<style>
:root{
  --cream:#fffaf6;
  --paper:#f8eee7;
  --brown:#6b4a3c;
  --gold:#b99462;
}
body{
  margin:0;

  color:#49362e;

}
.header{

}
.wrap{max-width:1100px;margin:auto;padding:22px 18px}
.card-edit{
  background:rgba(255,255,255,.82);

textarea.form-control{min-height:110px}

.comment-card{background:#fff;border:1px solid #ead8cb;border-radius:16px;padding:15px;margin-bottom:10px}

const $ = id => document.getElementById(id);

function setStatus(id, message, type="info"){
  const el = $(id);
  if(!el) return;
  el.textContent = message || "";
  el.className = "status " + type;
}

function escHtml(text){
  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function textToHtml(text){
  return escHtml(text).replace(/\r?\n/g,"<br>");
}

function getText(doc, selector){
  const el = doc.querySelector(selector);
  return el ? el.textContent.trim() : "";
}

function setText(doc, selector, value){
  const el = doc.querySelector(selector);
  if(el) el.textContent = value ?? "";
}

function setHtml(doc, selector, value){
  const el = doc.querySelector(selector);
  if(el) el.innerHTML = textToHtml(value);
}

function findGiftCard(doc, title){
  return [...doc.querySelectorAll(".gift-card")].find(card =>
    card.querySelector("strong")?.textContent.trim().toLowerCase() === title.toLowerCase()
  );
}

function extractData(html){
  const doc = new DOMParser().parseFromString(html,"text/html");
  const bride = doc.querySelector("#bride");
  const people = bride ? [...bride.querySelectorAll(".person-name")] : [];
  const groomBox = people[0]?.closest(".pb-2");
  const brideBox = people[1]?.closest(".pb-2");

  const groomPs = groomBox ? groomBox.querySelectorAll("p") : [];
  const bridePs = brideBox ? brideBox.querySelectorAll("p") : [];

  const dateSection = doc.querySelector("#wedding-date");
  const dateCards = dateSection ? dateSection.querySelectorAll(".section-card") : [];
  const mapsLink = dateSection?.querySelector('a[href*="maps.app.goo.gl"]');

  const transfer = findGiftCard(doc,"Transfer");
  const wallet = findGiftCard(doc,"E-Wallet");
  const gift = findGiftCard(doc,"Kirim Kado");

  const bodyTime = doc.body?.getAttribute("data-time") || "";

  let day = getText(doc,"#home p.mb-1");
  let dateText = getText(doc,"#home p.mb-4");
  if(!day) day = getText(doc,".desktop-cover-content p.m-0")?.split(",")[0] || "";

  let storyBlocks = [...doc.querySelectorAll("#love-story-page .story-block")];
  const stories = storyBlocks.slice(0,4).map(x => x.innerText.trim());

  const footerP = getText(doc,"section.no-gap-bottom p");

  const transferPs = transfer ? transfer.querySelectorAll("p") : [];
  const walletPs = wallet ? wallet.querySelectorAll("p") : [];

  return {
    groomFull: getText(doc,"#bride .person-name:nth-of-type(1)") || (people[0]?.textContent.trim() || ""),
    brideFull: people[1]?.textContent.trim() || "",
    groomShort: getText(doc,".welcome-name-line"),
    brideShort: getText(doc,".welcome-name-line:nth-of-type(3)"),
    groomFather: groomPs[1]?.textContent.trim() || "",
    groomMother: groomPs[3]?.textContent.trim() || "",
    brideFather: bridePs[1]?.textContent.trim() || "",
    brideMother: bridePs[3]?.textContent.trim() || "",
    groomChild: groomPs[0]?.textContent.trim() || "",
    brideChild: bridePs[0]?.textContent.trim() || "",
    weddingDay: day,
    weddingDateText: dateText,
    weddingTime: bodyTime,
    akadTime: dateCards[0]?.querySelectorAll("p")[1]?.textContent.trim().replace(/^Pukul\s*/i,"") || "",
    receptionTime: dateCards[1]?.querySelectorAll("p")[1]?.textContent.trim().replace(/^Pukul\s*/i,"") || "",
    location: dateSection?.querySelector("small.d-block.my-2")?.textContent.trim() || "",
    address: dateSection?.querySelector("small.d-block.my-2")?.textContent.trim() || "",
    maps: mapsLink?.getAttribute("href") || "",
    story2019: stories[0] || "",
    story2022: stories[1] || "",
    story2025: stories[2] || "",
    story2026: stories[3] || "",
    storyFinal: getText(doc,".story-final").replace(/\n+/g,"\n"),
    bankName: transfer?.querySelector(".d-flex.justify-content-between.align-items-center.mt-3 p")?.textContent.trim() || "",
    bank: transferPs[0]?.textContent.trim() || "",
    account: transferPs[1]?.textContent.trim() || "",
    walletName: wallet?.querySelector(".d-flex.justify-content-between.align-items-center.mt-3 p")?.textContent.trim() || "",
    gopay: walletPs[0]?.textContent.trim().replace(/^GoPay:\s*/i,"") || "",
    dana: walletPs[1]?.textContent.trim().replace(/^DANA:\s*/i,"") || "",
    giftAddress: gift?.querySelector("p.m-0")?.textContent.trim() || "",
    giftMaps: gift?.querySelector("a[href*='maps.app.goo.gl']")?.getAttribute("href") || "",
    opening: getText(doc,"#bride > p") || "",
    closing: footerP || ""
  };
}

function fillForm(data){
  const map = {
    groomFull:"groomFull", brideFull:"brideFull", groomShort:"groomShort", brideShort:"brideShort",
    groomFather:"groomFather", groomMother:"groomMother", brideFather:"brideFather", brideMother:"brideMother",
    groomChild:"groomChild", brideChild:"brideChild", weddingDay:"weddingDay", weddingDateText:"weddingDateText",
    weddingTime:"weddingTime", akadTime:"akadTime", receptionTime:"receptionTime", location:"location",
    address:"address", maps:"maps", story2019:"story2019", story2022:"story2022", story2025:"story2025",
    story2026:"story2026", storyFinal:"storyFinal", bankName:"bankName", bank:"bank", account:"account",
    walletName:"walletName", gopay:"gopay", dana:"dana", giftAddress:"giftAddress", giftMaps:"giftMaps",
    opening:"opening", closing:"closing"
  };
  for(const [key,id] of Object.entries(map)){
    $(id).value = data[key] ?? "";
  }
}

function formData(){
  const ids = [
    "groomFull","brideFull","groomShort","brideShort","groomFather","groomMother","brideFather","brideMother",
    "groomChild","brideChild","weddingDay","weddingDateText","weddingTime","akadTime","receptionTime","location",
    "address","maps","story2019","story2022","story2025","story2026","storyFinal","bankName","bank","account",
    "walletName","gopay","dana","giftAddress","giftMaps","opening","closing"
  ];
  const data = {};
  for(const id of ids) data[id] = $(id).value.trim();
  return data;
}

function applyInvitationData(html, data){
  const doc = new DOMParser().parseFromString(html,"text/html");

  // Kalau index sudah pernah disimpan oleh admin ini, hapus konfigurasi lama.
  doc.querySelector("#admin-invitation-data")?.remove();

  // Nama pendek: Ihsan / & / Syarifah
  const welcomeLines = doc.querySelectorAll(".welcome-name-line");
  if(welcomeLines[0]) welcomeLines[0].textContent = data.groomShort;
  if(welcomeLines[1]) welcomeLines[1].textContent = data.brideShort;

  // Nama lengkap + orang tua
  const people = doc.querySelectorAll("#bride .person-name");
  const boxes = [...people].map(x => x.closest(".pb-2"));
  if(boxes[0]){
    const ps = boxes[0].querySelectorAll("p");
    if(ps[0]) ps[0].textContent = data.groomChild;
    if(ps[1]) ps[1].textContent = data.groomFather;
    if(ps[3]) ps[3].textContent = data.groomMother;
    if(people[0]) people[0].textContent = data.groomFull;
  }
  if(boxes[1]){
    const ps = boxes[1].querySelectorAll("p");
    if(ps[0]) ps[0].textContent = data.brideChild;
    if(ps[1]) ps[1].textContent = data.brideFather;
    if(ps[3]) ps[3].textContent = data.brideMother;
    if(people[1]) people[1].textContent = data.brideFull;
  }

  // Tanggal
  if(doc.body) doc.body.setAttribute("data-time",data.weddingTime);

  doc.querySelectorAll(".welcome-date").forEach(el => {
    el.textContent = (data.weddingDay + ", " + data.weddingDateText).trim().toUpperCase();
  });

  doc.querySelectorAll(".desktop-cover-content .cover-title, #home .cover-title").forEach(el => {
    el.textContent = data.groomShort + " & " + data.brideShort;
  });

  const home = doc.querySelector("#home");
  if(home){
    const ps = home.querySelectorAll("p");
    [...ps].forEach(p => {
      const t = p.textContent.trim();
      if(t === "Minggu" || t === data.weddingDay) p.textContent = data.weddingDay;
      if(/^\d{1,2}\s+\w+\s+\d{4}$/i.test(t) || t === data.weddingDateText) p.textContent = data.weddingDateText;
    });
  }

  const dc = doc.querySelector(".desktop-cover-content");
  if(dc){
    const p = dc.querySelector("p.m-0");
    if(p) p.textContent = (data.weddingDay + ", " + data.weddingDateText).trim();
  }

  const dateSection = doc.querySelector("#wedding-date");
  if(dateSection){
    const cards = dateSection.querySelectorAll(".section-card");
    if(cards[0]){
      const ps = cards[0].querySelectorAll("p");
      if(ps[0]) ps[0].textContent = data.weddingDay + ", " + data.weddingDateText;
      if(ps[1]) ps[1].textContent = "Pukul " + data.akadTime;
    }
    if(cards[1]){
      const ps = cards[1].querySelectorAll("p");
      if(ps[0]) ps[0].textContent = data.weddingDay + ", " + data.weddingDateText;
      if(ps[1]) ps[1].textContent = "Pukul " + data.receptionTime;
    }
    const loc = dateSection.querySelector("small.d-block.my-2");
    if(loc) loc.textContent = data.location || data.address;

    const map = dateSection.querySelector('a[href*="maps.app.goo.gl"]');
    if(map) map.setAttribute("href",data.maps);
  }

  // Pembuka
  const opening = doc.querySelector("#bride > p");
  if(opening) opening.textContent = data.opening;

  // Kisah: isi 4 blok pertama secara utuh, mempertahankan tahun dari heading.
  const storyData = [data.story2019,data.story2022,data.story2025,data.story2026];
  const blocks = [...doc.querySelectorAll("#love-story-page .story-block")];
  blocks.slice(0,4).forEach((block,i) => {
    const year = block.querySelector(".story-year");
    block.querySelectorAll("p").forEach(p => p.remove());
    const p = doc.createElement("p");
    p.innerHTML = textToHtml(storyData[i]);
    block.appendChild(p);
    if(year) block.prepend(year);
  });

  const finalStory = doc.querySelector(".story-final");
  if(finalStory) finalStory.innerHTML = textToHtml(data.storyFinal);

  // Love Gift
  const transfer = findGiftCard(doc,"Transfer");
  if(transfer){
    const receiver = transfer.querySelector(".d-flex.justify-content-between.align-items-center.mt-3 p");
    if(receiver) receiver.textContent = data.bankName;

    const ps = transfer.querySelectorAll("#collapseTf p");
    if(ps[0]){
      ps[0].textContent = "";
      const icon = doc.createElement("i");
      icon.className = "fa-solid fa-building-columns me-1";
      ps[0].appendChild(icon);
      ps[0].appendChild(doc.createTextNode(data.bank));
    }
    if(ps[1]) ps[1].textContent = data.account;
    const copy = transfer.querySelector("[data-copy]");
    if(copy) copy.setAttribute("data-copy",data.account);
  }

  const wallet = findGiftCard(doc,"E-Wallet");
  if(wallet){
    const receiver = wallet.querySelector(".d-flex.justify-content-between.align-items-center.mt-3 p");
    if(receiver) receiver.textContent = data.walletName;
    const ps = wallet.querySelectorAll("#collapseWallet p");
    if(ps[0]) ps[0].textContent = "GoPay: " + data.gopay;
    if(ps[1]) ps[1].textContent = "DANA: " + data.dana;
  }

  const gift = findGiftCard(doc,"Kirim Kado");
  if(gift){
    const p = gift.querySelector("p.m-0");
    if(p) p.textContent = data.giftAddress;
    const a = gift.querySelector('a[href*="maps.app.goo.gl"]');
    if(a) a.setAttribute("href",data.giftMaps);
  }

  const closing = doc.querySelector("section.no-gap-bottom p");
  if(closing) closing.textContent = data.closing;

  // Simpan data terakhir sebagai metadata. Ini membuat edit berikutnya tetap stabil
  // walaupun isi index sudah berubah dari nilai awal.
  const marker = doc.createElement("script");
  marker.id = "admin-invitation-data";
  marker.type = "application/json";
  marker.textContent = JSON.stringify(data);
  doc.body.appendChild(marker);

  return "<!doctype html>\n" + doc.documentElement.outerHTML;
}

async function workerFetch(method="GET", body=null){
  if(!currentUser) throw new Error("Sesi admin belum tersedia.");

  const token = await currentUser.getIdToken(true);

  const options = {
    method,
    headers:{
      "Authorization":"Bearer " + token,
      "Accept":"application/json"
    }
  };

  if(body !== null){
    options.headers["Content-Type"]="application/json";
    options.body=JSON.stringify(body);
  }

  const response = await fetch(WORKER_URL, options);
  const raw = await response.text();

  let result;
  try{
    result = JSON.parse(raw);
  }catch{
    throw new Error("Worker mengirim respons yang bukan JSON. HTTP " + response.status + ": " + raw.slice(0,180));
  }

  if(!response.ok || result.error){
    throw new Error(result.error || ("HTTP " + response.status));
  }

  return result;
}

async function loadIndex(){
  setStatus("globalStatus","Mengambil index.html dari GitHub…","info");
  try{
    const result = await workerFetch("GET");
    if(typeof result.content !== "string" || !result.sha) throw new Error("Respons Worker tidak lengkap.");

    currentIndex = result.content;
    currentSha = result.sha;

    const marker = new DOMParser()
      .parseFromString(currentIndex,"text/html")
      .querySelector("#admin-invitation-data");

    if(marker){
      try{
        loadedData = JSON.parse(marker.textContent);
      }catch{
        loadedData = extractData(currentIndex);
      }
    }else{
      loadedData = extractData(currentIndex);
    }

    fillForm(loadedData);
    setStatus("globalStatus","Data undangan berhasil dimuat. Siap diedit.","ok");
  }catch(error){
    console.error(error);
    setStatus("globalStatus",error.message || "Gagal memuat data.","err");
  }
}

async function saveIndex(){
  const btn = $("saveBtn");
  btn.disabled = true;
  btn.textContent = "⏳ Menyimpan…";
  setStatus("globalStatus","Mengirim perubahan ke GitHub…","info");

  try{
    if(!currentIndex || !currentSha) await loadIndex();
    if(!currentIndex || !currentSha) throw new Error("index.html belum berhasil dimuat.");

    const data = formData();
    const newContent = applyInvitationData(currentIndex,data);

    const result = await workerFetch("PUT",{
      content:newContent,
      sha:currentSha
    });

    if(!result.success) throw new Error("GitHub tidak mengonfirmasi penyimpanan.");

    currentIndex = newContent;

    // Ambil ulang SHA terbaru dari GitHub supaya penyimpanan berikutnya tidak memakai SHA lama.
    const fresh = await workerFetch("GET");
    currentIndex = fresh.content;
    currentSha = fresh.sha;

    setStatus(
      "globalStatus",
      "✅ Berhasil! index.html sudah dikirim ke GitHub. GitHub Actions akan membuild/deploy otomatis.",
      "ok"
    );

    window.scrollTo({top:0,behavior:"smooth"});
  }catch(error){
    console.error(error);
    setStatus("globalStatus","❌ Gagal menyimpan: " + (error.message || "Kesalahan tidak diketahui"),"err");
  }finally{
    btn.disabled = false;
    btn.textContent = "💾 Simpan Perubahan ke GitHub";
  }
}

async function loadComments(){
  setStatus("commentsStatus","Memuat komentar…","info");
  const list = $("commentsList");
  list.innerHTML = "";

  try{
    const q = query(
      collection(db,"comments"),
      where("invitationId","==","ihsan-syarifah")
    );
    const snap = await getDocs(q);
    const comments = snap.docs.map(d => ({id:d.id,...d.data()}));

    comments.sort((a,b) => {
      const ta = a.createdAt?.seconds ?? 0;
      const tb = b.createdAt?.seconds ?? 0;
      return tb-ta;
    });

    if(!comments.length){
      list.innerHTML = '<div class="small-note">Belum ada komentar.</div>';
      setStatus("commentsStatus","Tidak ada komentar.","ok");
      return;
    }

    for(const c of comments){
      const div = document.createElement("div");
      div.className="comment-card";
      const presence = c.presence === true ? "✅ Datang" : "❌ Berhalangan";
      div.innerHTML = `
        <div class="d-flex justify-content-between gap-2">
          <strong>${escHtml(c.name || "Tanpa nama")}</strong>
          <span class="small-note">${presence}</span>
        </div>
        <div class="mt-2">${escHtml(c.comment || "").replace(/\n/g,"<br>")}</div>
        <button class="btn btn-sm btn-outline-danger rounded-pill mt-3 delete-comment" data-id="${escHtml(c.id)}">
          Hapus
        </button>
      `;
      div.querySelector(".delete-comment").addEventListener("click",async()=>{
        if(!confirm("Hapus komentar ini?")) return;
        try{
          await deleteDoc(doc(db,"comments",c.id));
          div.remove();
        }catch(e){
          alert("Gagal menghapus. Rules Firestore saat ini mungkin belum mengizinkan admin menghapus komentar tamu.");
          console.error(e);
        }
      });
      list.appendChild(div);
    }

    setStatus("commentsStatus",comments.length + " komentar dimuat.","ok");
  }catch(error){
    console.error(error);
    setStatus("commentsStatus","Gagal memuat komentar: " + error.message,"err");
  }
}

  const password=$("loginPassword").value;

  try{
    await signInWithEmailAndPassword(auth,email,password);
  }catch(error){
    console.error(error);
    setStatus("loginStatus",error.message || "Login gagal.","err");
  }
});

$("loginPassword").addEventListener("keydown",e=>{
  if(e.key==="Enter") $("loginBtn").click();
});

$("logoutBtn").addEventListener("click",()=>signOut(auth));
$("saveBtn").addEventListener("click",saveIndex);

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    $("tab-"+btn.dataset.tab).classList.add("active");
    if(btn.dataset.tab==="comments") loadComments();
  });
});

onAuthStateChanged(auth,async(user)=>{
  currentUser=user;

  if(!user){
    $("app").style.display="none";
    $("login").style.display="flex";
    return;
  }

  if(user.uid!==ADMIN_UID){
    await signOut(auth);
    setStatus("loginStatus","Akun ini bukan akun admin yang diizinkan.","err");
    return;
  }

  $("login").style.display="none";
  $("app").style.display="block";
  $("userEmail").textContent=user.email || "";
  await loadIndex();
});
</script>
