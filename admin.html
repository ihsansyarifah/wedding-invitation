<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Komentar — Ihsan & Syarifah</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

<style>
:root{
  --cream:#fffaf6;
  --paper:#f8eee7;
  --brown:#6b4a3c;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#fffaf6,#f8eee7);
  color:#49362e;
  font-family:Arial,sans-serif;
}

.header{
  background:rgba(255,250,246,.96);
  border-bottom:1px solid #ead8cb;
  position:sticky;
  top:0;
  z-index:20;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:22px 18px;
}

.login-box{
  width:min(420px,100%);
  background:#fff;
  border:1px solid #ead8cb;
  border-radius:24px;
  padding:28px;
  box-shadow:0 15px 50px rgba(91,62,49,.1);
}

#login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

#app{
  display:none;
}

.card-edit{
  background:rgba(255,255,255,.82);
  border:1px solid #ead8cb;
  border-radius:22px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 10px 35px rgba(91,62,49,.07);
}

h2{
  font-size:1.25rem;
  color:var(--brown);
  margin-bottom:18px;
}

label{
  font-weight:600;
  font-size:.9rem;
  margin-bottom:7px;
}

.form-control{
  border-radius:13px;
  border-color:#dfcfc5;
  min-height:46px;
}

.btn-admin{
  background:var(--brown);
  color:#fff;
  border:0;
  border-radius:14px;
  padding:12px 22px;
  font-weight:700;
}

.btn-admin:hover{
  background:#56392d;
  color:#fff;
}

.status{
  display:none;
  border-radius:14px;
  padding:12px 15px;
  margin-bottom:18px;
}

.status.ok{
  display:block;
  background:#e8f6ea;
  color:#23652d;
}

.status.err{
  display:block;
  background:#fde8e8;
  color:#a51f1f;
}

.status.info{
  display:block;
  background:#e9f1fb;
  color:#1d4f80;
}

.small-note{
  font-size:.83rem;
  color:#7a6b63;
}

.comment-card{
  background:#fff;
  border:1px solid #ead8cb;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
}

.comment-name{
  color:#6b4a3c;
  font-weight:700;
}

.comment-text{
  margin-top:10px;
  line-height:1.6;
  white-space:normal;
  overflow-wrap:anywhere;
}

.comment-meta{
  font-size:.82rem;
  color:#8a7b73;
  margin-top:8px;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#8a7b73;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">

  <div class="login-box">

    <h1 class="h4 mb-2">💍 Admin Undangan</h1>

    <p class="small-note mb-4">
      Masuk untuk melihat dan mengelola ucapan tamu.
    </p>

    <div id="loginStatus" class="status"></div>

    <div class="mb-3">
      <label>Email</label>
      <input
        id="loginEmail"
        type="email"
        class="form-control"
        autocomplete="username"
      >
    </div>

    <div class="mb-3">
      <label>Password</label>
      <input
        id="loginPassword"
        type="password"
        class="form-control"
        autocomplete="current-password"
      >
    </div>

    <button
      id="loginBtn"
      class="btn-admin w-100"
      type="button"
    >
      Masuk
    </button>

  </div>

</div>


<!-- APP -->
<div id="app">

  <div class="header">

    <div class="wrap d-flex justify-content-between align-items-center">

      <div>
        <strong>💍 Admin Undangan</strong>

        <div
          id="userEmail"
          class="small-note"
        ></div>
      </div>

      <button
        id="logoutBtn"
        class="btn btn-outline-secondary rounded-pill px-4"
      >
        Keluar
      </button>

    </div>

  </div>


  <main class="wrap">

    <div id="globalStatus" class="status"></div>


    <section class="card-edit">

      <h2>💌 Ucapan & Doa</h2>

      <p class="small-note mb-4">
        Semua ucapan dari tamu akan muncul di sini.
      </p>

      <div id="commentsStatus" class="status"></div>

      <div id="commentsList"></div>

    </section>

  </main>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";



/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCcLt3DT1DYdmThAJK91TcEYvVDVZyonzI",

  authDomain:
    "undangan-ihsan-syarifah.firebaseapp.com",

  projectId:
    "undangan-ihsan-syarifah",

  storageBucket:
    "undangan-ihsan-syarifah.firebasestorage.app",

  messagingSenderId:
    "877091672086",

  appId:
    "1:877091672086:web:9758a37f0c575cc1b3a537"

};


const ADMIN_UID =
  "DwMXUyfyChMp85zsb9L5rFy6Tg53";


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


let currentUser = null;



/* =========================
   HELPER
========================= */

const $ = id =>
  document.getElementById(id);


function setStatus(
  id,
  message,
  type = "info"
){

  const el = $(id);

  if(!el) return;

  el.textContent =
    message || "";

  el.className =
    "status " + type;
}


function escHtml(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(){

  setStatus(
    "commentsStatus",
    "Memuat komentar…",
    "info"
  );


  const list =
    $("commentsList");


  list.innerHTML = "";


  try{

    const q = query(

      collection(
        db,
        "comments"
      ),

      where(
        "invitationId",
        "==",
        "ihsan-syarifah"
      )

    );


    const snap =
      await getDocs(q);


    const comments =
      snap.docs.map(docSnap => ({

        id: docSnap.id,

        ...docSnap.data()

      }));


    /* Urutkan terbaru di atas */

    comments.sort((a,b) => {

      const ta =
        a.createdAt?.seconds ?? 0;

      const tb =
        b.createdAt?.seconds ?? 0;

      return tb - ta;

    });


    if(!comments.length){

      list.innerHTML = `
        <div class="empty">
          💌<br>
          Belum ada ucapan dari tamu.
        </div>
      `;

      setStatus(
        "commentsStatus",
        "Belum ada komentar.",
        "ok"
      );

      return;

    }


    for(const comment of comments){

      const div =
        document.createElement("div");


      div.className =
        "comment-card";


      const name =
        comment.name ||
        "Tanpa nama";


      const message =
        comment.comment ||
        "";


      const presence =
        comment.presence === true
          ? "✅ Datang"
          : "❌ Berhalangan";


      let dateText = "";


      if(comment.createdAt){

        try{

          let date;

          if(
            typeof comment.createdAt.toDate ===
            "function"
          ){

            date =
              comment.createdAt.toDate();

          }else if(
            comment.createdAt.seconds
          ){

            date =
              new Date(
                comment.createdAt.seconds * 1000
              );

          }


          if(date){

            dateText =
              date.toLocaleString(
                "id-ID",
                {
                  dateStyle:"medium",
                  timeStyle:"short"
                }
              );

          }

        }catch(error){

          console.warn(
            "Tanggal komentar tidak bisa dibaca:",
            error
          );

        }

      }


      div.innerHTML = `

        <div class="d-flex justify-content-between align-items-start gap-3">

          <div>

            <div class="comment-name">
              ${escHtml(name)}
            </div>

            <div class="comment-meta">
              ${escHtml(presence)}
              ${dateText ? " • " + escHtml(dateText) : ""}
            </div>

          </div>

          <button
            class="btn btn-sm btn-outline-danger rounded-pill delete-comment"
            type="button"
          >
            🗑️ Hapus
          </button>

        </div>


        <div class="comment-text">
          ${escHtml(message).replace(/\n/g,"<br>")}
        </div>

      `;


      const deleteButton =
        div.querySelector(
          ".delete-comment"
        );


      deleteButton.addEventListener(
        "click",
        async () => {

          const confirmed =
            confirm(
              `Hapus ucapan dari "${name}"?`
            );


          if(!confirmed) return;


          deleteButton.disabled = true;

          deleteButton.textContent =
            "Menghapus…";


          try{

            await deleteDoc(
              doc(
                db,
                "comments",
                comment.id
              )
            );


            div.remove();


            setStatus(
              "commentsStatus",
              "✅ Komentar berhasil dihapus.",
              "ok"
            );


            if(
              !$("commentsList").children.length
            ){

              $("commentsList").innerHTML = `
                <div class="empty">
                  💌<br>
                  Belum ada ucapan dari tamu.
                </div>
              `;

            }


          }catch(error){

            console.error(error);


            deleteButton.disabled =
              false;

            deleteButton.textContent =
              "🗑️ Hapus";


            setStatus(
              "commentsStatus",
              "❌ Gagal menghapus komentar: " +
              (error.message || "Kesalahan tidak diketahui."),
              "err"
            );

          }

        }
      );


      list.appendChild(div);

    }


    setStatus(
      "commentsStatus",
      comments.length +
      " komentar berhasil dimuat.",
      "ok"
    );


  }catch(error){

    console.error(error);


    setStatus(
      "commentsStatus",
      "❌ Gagal memuat komentar: " +
      (error.message || "Kesalahan tidak diketahui."),
      "err"
    );

  }

}



/* =========================
   LOGIN
========================= */

$("loginBtn").addEventListener(
  "click",
  async () => {

    const email =
      $("loginEmail")
        .value
        .trim();


    const password =
      $("loginPassword")
        .value;


    if(!email || !password){

      setStatus(
        "loginStatus",
        "Email dan password wajib diisi.",
        "err"
      );

      return;

    }


    setStatus(
      "loginStatus",
      "Memeriksa akun…",
      "info"
    );


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }catch(error){

      console.error(error);


      setStatus(
        "loginStatus",
        "Login gagal. Periksa email dan password.",
        "err"
      );

    }

  }
);



/* ENTER = LOGIN */

$("loginPassword").addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      $("loginBtn").click();

    }

  }
);



/* =========================
   LOGOUT
========================= */

$("logoutBtn").addEventListener(
  "click",
  async () => {

    try{

      await signOut(auth);

    }catch(error){

      console.error(error);

    }

  }
);



/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser =
      user;


    /* Belum login */

    if(!user){

      $("app").style.display =
        "none";

      $("login").style.display =
        "flex";

      $("userEmail").textContent =
        "";

      return;

    }


    /* Pastikan akun adalah admin */

    if(
      user.uid !== ADMIN_UID
    ){

      await signOut(auth);


      setStatus(
        "loginStatus",
        "Akun ini bukan akun admin yang diizinkan.",
        "err"
      );


      return;

    }


    /* Berhasil login */

    $("login").style.display =
      "none";

    $("app").style.display =
      "block";


    $("userEmail").textContent =
      user.email || "";


    await loadComments();

  }

);

</script>

</body>
</html>
