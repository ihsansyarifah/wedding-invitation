<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17130f">
<title>Wedding Invitation — Ihsan & Syarifah</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#17130f;
  }
  body{
    font-family: Georgia, "Times New Roman", serif;
    color:#fff;
    -webkit-tap-highlight-color:transparent;
  }

  #app{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#17130f;
    cursor:pointer;
  }

  .scene{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .scene.active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }

  /* Semua artwork memakai rasio portrait aset dan memenuhi layar.
     object-fit:cover menjaga layar HP tetap penuh. */
  .art{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    transform:scale(1);
    transform-origin:center center;
    will-change:transform,filter;
    user-select:none;
    -webkit-user-drag:none;
  }

  /* =========================
     SCENE 0
     ========================= */
  #scene0{
    transition:opacity .9s ease;
  }
  #scene0 .camera{
    position:absolute;
    inset:0;
    transform:scale(1);
    transform-origin:50% 50%;
    will-change:transform,filter;
  }
  #scene0 .camera .art{
    transform:none;
  }

  .opening-content{
    position:absolute;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    pointer-events:none;
    padding:0 11%;
  }

  /* Tulisan berada DI DALAM area bingkai. */
  .guest-label{
    margin-top:-3vh;
    font-size:clamp(11px,3vw,17px);
    letter-spacing:.32em;
    text-transform:uppercase;
    line-height:1.7;
    color:rgba(255,255,255,.96);
    text-shadow:0 2px 10px rgba(77,45,18,.38);
  }

  .guest-name{
    margin-top:10px;
    font-size:clamp(25px,7.5vw,46px);
    line-height:1.15;
    font-weight:500;
    color:#fff;
    text-shadow:0 2px 14px rgba(67,38,10,.45);
    max-width:85%;
  }

  .envelope-hint{
    position:absolute;
    left:50%;
    bottom:11.5%;
    transform:translateX(-50%);
    width:max-content;
    max-width:90%;
    font-size:clamp(11px,3vw,16px);
    letter-spacing:.28em;
    text-transform:uppercase;
    color:rgba(255,255,255,.98);
    text-shadow:0 2px 12px rgba(62,35,10,.5);
    white-space:nowrap;
    animation:breath 2.2s ease-in-out infinite;
  }

  .tap-anywhere{
    position:absolute;
    inset:0;
    z-index:20;
    pointer-events:auto;
    cursor:pointer;
  }

  @keyframes breath{
    0%,100%{opacity:.68;transform:translateX(-50%) translateY(0)}
    50%{opacity:1;transform:translateX(-50%) translateY(-3px)}
  }

  /* =========================
     SCENE 1
     ========================= */
  #scene1{
    transition:opacity .9s ease;
  }
  #scene1 .stack{
    position:absolute;
    inset:0;
    overflow:hidden;
  }
  #scene1 .overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    opacity:0;
    transform:scale(.94);
    transform-origin:center;
  }
  #scene1.show-overlay .overlay{
    animation:popupBounce 1.05s cubic-bezier(.18,.89,.32,1.28) forwards;
  }

  @keyframes popupBounce{
    0%{opacity:0;transform:scale(.92)}
    55%{opacity:1;transform:scale(1.035)}
    78%{transform:scale(.988)}
    100%{opacity:1;transform:scale(1)}
  }

  .loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#17130f;
    color:#fff;
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    z-index:100;
    transition:opacity .5s ease;
  }
  .loading.hide{
    opacity:0;
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="app">

  <!-- SCENE 0 -->
  <section id="scene0" class="scene active">
    <div class="camera" id="openingCamera">
      <img class="art" src="assets/00.webp" alt="Opening invitation">

      <div class="opening-content">
        <div class="guest-label">Kepada Yang Terhormat</div>
        <div class="guest-name" id="guestName">Nama Tamu Undangan</div>
      </div>

      <div class="envelope-hint">Buka Undangan</div>
    </div>

    <!-- Klik DI MANA SAJA -->
    <button class="tap-anywhere" id="openInvitation" aria-label="Buka undangan"></button>
  </section>

  <!-- SCENE 1 -->
  <section id="scene1" class="scene">
    <div class="stack">
      <img class="art" src="assets/01.webp" alt="Scene 1">
      <img class="overlay" src="assets/01 A.webp" alt="">
    </div>
  </section>

  <div class="loading" id="loading">Memuat undangan</div>
</div>

<script>
(() => {
  const scene0 = document.getElementById('scene0');
  const scene1 = document.getElementById('scene1');
  const camera = document.getElementById('openingCamera');
  const openButton = document.getElementById('openInvitation');
  const loading = document.getElementById('loading');
  const guestName = document.getElementById('guestName');

  // Nama tamu bisa nanti disambungkan dari link:
  // https://.../?to=Nama%20Tamu
  const params = new URLSearchParams(location.search);
  const to = params.get('to');
  if (to) {
    guestName.textContent = decodeURIComponent(to.replace(/\+/g, ' '));
  }

  // Pastikan gambar tersedia sebelum interaksi.
  const images = [
    'assets/00.webp',
    'assets/01.webp',
    'assets/01 A.webp'
  ];

  let loaded = 0;
  images.forEach(src => {
    const img = new Image();
    img.onload = img.onerror = () => {
      loaded++;
      if (loaded >= images.length) loading.classList.add('hide');
    };
    img.src = src;
  });

  // Fallback supaya tombol tetap aktif walaupun preload gagal.
  setTimeout(() => loading.classList.add('hide'), 1800);

  let opening = false;

  function openInvitation(){
    if (opening) return;
    opening = true;

    // Hilangkan area klik agar tidak memicu dua kali.
    openButton.style.pointerEvents = 'none';

    // Zoom panjang menuju area amplop.
    // Titik pusat bisa diubah nanti tanpa mengubah aset.
    camera.style.transition =
      'transform 2.35s cubic-bezier(.18,.72,.2,1), filter 2.35s ease';
    camera.style.transformOrigin = '50% 61%';
    camera.style.transform = 'scale(2.45)';
    camera.style.filter = 'blur(.35px)';

    // Setelah zoom, dissolve halus menuju scene 1.
    setTimeout(() => {
      scene0.classList.remove('active');
      scene1.classList.add('active');

      requestAnimationFrame(() => {
        scene1.classList.add('show-overlay');
      });

      // Reset scene 0 untuk bila halaman diulang.
      setTimeout(() => {
        camera.style.transition = '';
        camera.style.transform = '';
        camera.style.filter = '';
      }, 1000);
    }, 1900);
  }

  // Klik/tap di MANA SAJA pada Scene 0.
  openButton.addEventListener('click', openInvitation);
  openButton.addEventListener('touchend', (e) => {
    e.preventDefault();
    openInvitation();
  }, {passive:false});

  // Keyboard juga bisa membuka.
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && !opening) {
      openInvitation();
    }
  });
})();
</script>
</body>
</html>
