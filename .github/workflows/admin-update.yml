name: Admin Update Invitation

on:
  workflow_dispatch:
    inputs:
      invitation_data:
        description: "Data undangan JSON"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update index.html
        env:
          INVITATION_DATA: ${{ inputs.invitation_data }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(os.environ["INVITATION_DATA"])

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          replacements = {
              "{{GROOM_NAME}}": data.get("groomName", ""),
              "{{BRIDE_NAME}}": data.get("brideName", ""),
              "{{GROOM_FATHER}}": data.get("groomFather", ""),
              "{{GROOM_MOTHER}}": data.get("groomMother", ""),
              "{{BRIDE_FATHER}}": data.get("brideFather", ""),
              "{{BRIDE_MOTHER}}": data.get("brideMother", ""),
              "{{WEDDING_DATE}}": data.get("weddingDate", ""),
              "{{AKAD_TIME}}": data.get("akadTime", ""),
              "{{RECEPTION_TIME}}": data.get("receptionTime", ""),
              "{{LOCATION}}": data.get("location", ""),
              "{{ADDRESS}}": data.get("address", ""),
              "{{MAPS}}": data.get("maps", ""),
              "{{STORY_2019}}": data.get("story2019", ""),
              "{{STORY_2022}}": data.get("story2022", ""),
              "{{STORY_2025}}": data.get("story2025", ""),
              "{{STORY_2026}}": data.get("story2026", ""),
              "{{OPENING}}": data.get("opening", ""),
              "{{CLOSING}}": data.get("closing", "")
          }

          for old, new in replacements.items():
              html = html.replace(old, new)

          path.write_text(html, encoding="utf-8")
          print("index.html berhasil diperbarui.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "admin: update invitation"
            git push
          fi
