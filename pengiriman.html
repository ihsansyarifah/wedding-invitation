<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Pengiriman Undangan — Ihsan & Syarifah</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#24324a}
.header{background:linear-gradient(135deg,#274c77,#6096ba);color:#fff;padding:22px 18px}.header h1{margin:0;font-size:22px}.header p{margin:5px 0 0;opacity:.9}
.container{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px rgba(0,0,0,.07);margin-bottom:16px}
.login{max-width:430px;margin:70px auto}label{display:block;font-weight:700;margin:12px 0 6px}select,input{width:100%;padding:12px;border:1px solid #d7deea;border-radius:10px;background:#fff}
.primary{width:100%;border:0;border-radius:10px;padding:13px;background:#274c77;color:#fff;font-weight:700;margin-top:14px;cursor:pointer}
.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.badge{padding:8px 12px;border-radius:999px;background:#eef3f8}
.controls{display:grid;grid-template-columns:1fr 180px;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}
.stat{padding:15px;border-radius:12px;background:#f5f8fc;text-align:center}.stat b{display:block;font-size:24px}.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 9px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top}th{background:#f8fafc}
.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:700}.preview{background:#edf4fb;color:#274c77}.wa{background:#e8f7ee;color:#176b3a}.sent{background:#274c77;color:#fff}
.error{background:#fff0f0;color:#a21d1d;padding:12px;border-radius:10px;margin-top:12px}.loading{text-align:center;padding:25px;color:#68778d}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-box{background:#fff;border-radius:16px;max-width:650px;width:100%;max-height:85vh;overflow:auto;padding:18px}
.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.close{border:0;background:#eee;border-radius:8px;padding:8px 12px;cursor:pointer}.message{white-space:pre-wrap;background:#f7f9fc;border-radius:12px;padding:15px;line-height:1.55}.small{font-size:13px;color:#718096}
@media(max-width:650px){.controls{grid-template-columns:1fr}.container{padding:12px}.card{padding:14px}}
</style>
</head>
<body>
<div id="loginPage">
  <div class="header"><h1>SISTEM PENGIRIMAN UNDANGAN</h1><p>Ihsan &amp; Syarifah</p></div>
  <div class="container"><div class="card login">
    <h2>🔐 Pilih Pengirim</h2><p class="small">Pilih nama pengirim untuk melihat daftar tamu yang ditugaskan.</p>
    <label>Pengirim</label>
    <select id="loginSender">
      <option value="">-- Pilih Pengirim --</option><option>Ihsan</option><option>Syarifah</option><option>Ibu Ihsan</option><option>Bapa Ihsan</option><option>Mama Syarifah</option><option>Bapa Syarifah</option>
    </select>
    <button class="primary" onclick="login()">Masuk</button><div id="loginError"></div>
  </div></div>
</div>

<div id="app" style="display:none">
  <div class="header"><div class="container" style="padding-top:0;padding-bottom:0"><div class="topbar">
    <div style="flex:1"><h1>SISTEM PENGIRIMAN UNDANGAN</h1><p>Ihsan &amp; Syarifah</p></div>
    <div class="badge" style="background:rgba(255,255,255,.18);color:#fff" id="loggedUser">👤</div>
    <button class="btn" onclick="logout()" style="background:#fff;color:#274c77">Keluar</button>
  </div></div></div>
  <div class="container"><div class="card">
    <div class="controls"><input id="search" placeholder="🔎 Cari nama atau nomor WhatsApp..." oninput="renderGuests()">
      <select id="statusFilter" onchange="renderGuests()"><option value="">Semua Status</option><option value="Belum dikirim">Belum dikirim</option><option value="Terkirim">Terkirim</option></select>
    </div>
    <div class="stats"><div class="stat">Tamu saya<b id="countAll">0</b></div><div class="stat">Belum dikirim<b id="countPending">0</b></div><div class="stat">Sudah terkirim<b id="countSent">0</b></div></div>
    <div id="tableState" class="loading">Mengambil data tamu...</div><div id="errorBox" class="error" style="display:none"></div>
    <div class="table-wrap" id="guestTable" style="display:none"><table><thead><tr><th>No</th><th>Nama</th><th>WhatsApp</th><th>Kategori</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="guestBody"></tbody></table></div>
  </div></div>
</div>

<div class="modal" id="previewModal"><div class="modal-box">
  <div class="modal-head"><h2 style="margin:0">💬 Lihat Pesan</h2><button class="close" onclick="closePreview()">Tutup</button></div>
  <p id="previewFor" class="small"></p><div id="previewText" class="message"></div><button class="primary" onclick="sendFromPreview()">📲 Kirim ke WhatsApp</button>
</div></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzXdTs7LpenGEcu4HP3EOq_4TYleXYaN8EL7qbDeURb16MUU7-7ZNBRHjIlHEHkAiLOJA/exec";
const INVITATION_URL="https://ihsansyarifah.github.io/wedding-invitation/";
const SENDERS=["Ihsan","Syarifah","Ibu Ihsan","Bapa Ihsan","Mama Syarifah","Bapa Syarifah"];
let loggedSender="",guests=[],previewGuest=null;
const $=id=>document.getElementById(id);
function login(){const s=$("loginSender").value.trim();if(!s){$("loginError").innerHTML='<div class="error">Pilih pengirim terlebih dahulu.</div>';return}loggedSender=s;sessionStorage.setItem("loggedSender",s);$("loggedUser").textContent="👤 "+s;$("loginPage").style.display="none";$("app").style.display="block";loadGuests()}
function logout(){sessionStorage.removeItem("loggedSender");location.reload()}
function showError(m){$("tableState").style.display="none";$("guestTable").style.display="none";$("errorBox").style.display="block";$("errorBox").textContent=m}
function loadGuests(){
  $("errorBox").style.display="none";$("tableState").style.display="block";$("tableState").textContent="Mengambil data tamu...";$("guestTable").style.display="none";
  const cb="guestCallback_"+Date.now();
  window[cb]=function(r){try{if(r&&r.success){guests=Array.isArray(r.data)?r.data:[];renderGuests()}else showError((r&&r.message)||"Data tamu gagal diambil.")}finally{delete window[cb];const x=document.getElementById(cb);if(x)x.remove()}};
  const s=document.createElement("script");s.id=cb;s.src=API_URL+"?action=guests&callback="+encodeURIComponent(cb)+"&_="+Date.now();
  s.onerror=function(){delete window[cb];s.remove();showError("Chrome tidak berhasil mengambil data Google Sheets. Coba muat ulang halaman.")};document.body.appendChild(s);
}
function clean(v){return v==null?"":String(v).trim()}
function esc(s){return clean(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function renderGuests(){
  const mine=guests.filter(g=>clean(g["Pengirim"])===loggedSender),q=clean($("search").value).toLowerCase(),st=$("statusFilter").value;
  $("countAll").textContent=mine.length;$("countPending").textContent=mine.filter(g=>clean(g["Status"])!=="Terkirim").length;$("countSent").textContent=mine.filter(g=>clean(g["Status"])==="Terkirim").length;
  const list=mine.filter(g=>(!q||[g["Nama Tamu"],g["No. WhatsApp"],g["Kategori"]].join(" ").toLowerCase().includes(q))&&(!st||clean(g["Status"])===st));
  $("tableState").style.display=list.length?"none":"block";$("tableState").textContent=mine.length?"Tidak ada tamu yang cocok.":"Belum ada tamu yang ditugaskan kepada "+loggedSender+".";$("guestTable").style.display=list.length?"block":"none";
  $("guestBody").innerHTML=list.map((g,i)=>{const sent=clean(g["Status"])==="Terkirim",id=clean(g["ID"]);return `<tr><td>${i+1}</td><td><strong>${esc(g["Nama Tamu"])}</strong><br><span class="small">${esc(g["Sapaan"])}</span></td><td>${esc(g["No. WhatsApp"])}</td><td>${esc(g["Kategori"])||"-"}</td><td>${sent?"☑ Terkirim":"⏳ Belum dikirim"}</td><td><div class="actions"><button class="btn preview" onclick='previewById(${JSON.stringify(id)})'>💬 Lihat Pesan</button><button class="btn wa" onclick='sendById(${JSON.stringify(id)})'>📲 Kirim</button>${sent?"":`<button class="btn sent" onclick='markSentById(${JSON.stringify(id)})'>☑ Terkirim</button>`}</div></td></tr>`}).join("");
}
function findGuest(id){return guests.find(g=>clean(g["ID"])===clean(id))}
function phone(v){let p=clean(v).replace(/[^\d+]/g,"");if(p[0]==="+")p=p.slice(1);if(p.startsWith("0"))p="62"+p.slice(1);return p}
function makeMessage(g){const sapaan=clean(g["Sapaan"])||"Bapak/Ibu/Saudara/i",name=clean(g["Nama Tamu"]),link=INVITATION_URL+"?to="+encodeURIComponent(name);return `Yth. ${sapaan} ${name}
Di Tempat
-----------------------------------------------------

بِسْــــــــــــــــــمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ

ٱلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللّٰهِ وَبَرَكَاتُهُ


Dengan segala kerendahan hati dan dengan ungkapan syukur atas karunia Allah SWT, kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri resepsi pernikahan putra-putri kami yang Insya Allah akan dilaksanakan pada:

===========================
🗓️ Hari, Tanggal: Minggu, 20 Desember 2026
🕓 Jam: 11.00 - 14.00 WIB
📍 Tempat: Gedung Daarul Matiin Cibadak
(Jl. ........................)
Link undangan dapat diakses lengkap di:
${link}
===========================

Kehadiran Bapak/Ibu/Saudara/i adalah silaturahmi.
Doa restu Bapak/Ibu/Saudara/i adalah kado terindah bagi kami.
Kehadiran Bapak/Ibu/Saudara/i adalah doa restu yang tidak ternilai harganya.

Jazakumullahu khoiron katsiron, hanya kepada Ilahi Robbi tercurah doa sebagai ungkapan terima kasih kami.

وَالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللّٰهِ وَبَرَكَاتُهُ`}
function previewById(id){const g=findGuest(id);if(!g)return;previewGuest=g;$("previewFor").textContent=clean(g["Nama Tamu"])+" • "+clean(g["No. WhatsApp"]);$("previewText").textContent=makeMessage(g);$("previewModal").style.display="flex"}
function closePreview(){$("previewModal").style.display="none";previewGuest=null}
function sendFromPreview(){if(previewGuest)sendGuest(previewGuest)}
function sendById(id){const g=findGuest(id);if(g)sendGuest(g)}
function sendGuest(g){const p=phone(g["No. WhatsApp"]);if(!p){alert("Nomor WhatsApp tamu belum tersedia.");return}location.href="https://wa.me/"+p+"?text="+encodeURIComponent(makeMessage(g))}
function markSentById(id){const g=findGuest(id);if(!g||!confirm("Tandai "+clean(g["Nama Tamu"])+" sebagai Terkirim?"))return;g["Status"]="Terkirim";renderGuests();const f=document.createElement("iframe");f.style.display="none";f.src=API_URL+"?action=updateStatus&id="+encodeURIComponent(clean(g["ID"]))+"&status=Terkirim&_="+Date.now();document.body.appendChild(f);setTimeout(()=>f.remove(),5000)}
(function(){const s=sessionStorage.getItem("loggedSender");if(s&&SENDERS.includes(s)){loggedSender=s;$("loggedUser").textContent="👤 "+s;$("loginPage").style.display="none";$("app").style.display="block";loadGuests()}})();
</script>
</body>
</html>
