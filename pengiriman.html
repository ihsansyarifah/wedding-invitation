<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Pengiriman Undangan - Ihsan & Syarifah</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#1f2937}
.wrap{max-width:1100px;margin:auto;padding:20px}
.header{background:linear-gradient(135deg,#315f8f,#6f94b8);color:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.1);margin-bottom:18px}
.header h1{margin:0 0 6px;font-size:25px}.header p{margin:0;opacity:.92}
.userline{margin-top:9px;font-size:14px}.note{font-size:12px;margin-top:4px;opacity:.9}
.logout{float:right;border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;cursor:pointer}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(0,0,0,.07);margin-bottom:16px}
.login-title{font-size:18px;font-weight:700;margin-bottom:12px}
select,input{width:100%;padding:12px 13px;border:1px solid #d5dce5;border-radius:10px;font-size:15px;background:#fff}
button{border:0;border-radius:10px;padding:10px 13px;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:#315f8f;color:#fff}.secondary{background:#eef3f8;color:#315f8f}.success{background:#2e8b57;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:15px;border-radius:12px;background:#f6f8fb;text-align:center}.stat b{display:block;font-size:25px;color:#315f8f;margin-bottom:4px}
.toolbar{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-bottom:15px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:12px 10px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:middle}
th{background:#f7f9fc;font-size:13px;color:#566273}td{font-size:14px}
.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}
.pending{background:#fff2d8;color:#9a6500}.sent{background:#def5e8;color:#19703f}
.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;padding:30px;color:#77808c}
.loading{text-align:center;padding:25px;color:#64748b}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:650px;width:100%;max-height:85vh;overflow:auto;padding:20px}
.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.modal-head h3{margin:0}
.message{white-space:pre-wrap;background:#f7f8fa;border:1px solid #e2e6eb;border-radius:12px;padding:15px;margin-top:15px;line-height:1.55;font-size:14px}
.close{background:#eee;color:#333}
.snack{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 17px;border-radius:10px;display:none;z-index:50;font-size:14px;box-shadow:0 5px 20px rgba(0,0,0,.2);max-width:90%;text-align:center}
.snack.show{display:block}
#app{display:none}
@media(max-width:700px){.wrap{padding:12px}.header{padding:19px}.header h1{font-size:21px}.stats{gap:7px}.stat{padding:11px 5px}.stat b{font-size:20px}.toolbar{grid-template-columns:1fr}.actions button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <button type="button" class="logout" id="logoutBtn" style="display:none">Keluar</button>
    <h1>SISTEM PENGIRIMAN UNDANGAN</h1>
    <p>Ihsan &amp; Syarifah</p>
    <div class="userline" id="userLine"></div>
    <div class="note" id="templateNote"></div>
  </div>

  <div class="card" id="loginCard">
    <div class="login-title">Pilih Pengirim</div>
    <select id="senderSelect">
      <option value="">-- Pilih nama pengirim --</option>
      <option value="Ihsan">Ihsan</option>
      <option value="Syarifah">Syarifah</option>
      <option value="Ibu Ihsan">Ibu Ihsan</option>
      <option value="Bapa Ihsan">Bapa Ihsan</option>
      <option value="Mama Syarifah">Mama Syarifah</option>
      <option value="Bapa Syarifah">Bapa Syarifah</option>
    </select>
    <button type="button" class="primary" id="loginBtn" style="width:100%;margin-top:12px">Masuk</button>
  </div>

  <div id="app">
    <div class="stats card">
      <div class="stat"><b id="totalCount">0</b><span>Tamu Saya</span></div>
      <div class="stat"><b id="pendingCount">0</b><span>Belum Dikirim</span></div>
      <div class="stat"><b id="sentCount">0</b><span>Sudah Terkirim</span></div>
    </div>

    <div class="card">
      <div class="toolbar">
        <input id="searchInput" type="text" placeholder="Cari nama tamu...">
        <select id="statusFilter">
          <option value="all">Semua Status</option>
          <option value="Belum dikirim">Belum dikirim</option>
          <option value="Terkirim">Terkirim</option>
        </select>
      </div>

      <div id="loading" class="loading">Memuat data tamu...</div>
      <div class="table-wrap" id="tableWrap" style="display:none">
        <table>
          <thead><tr><th>No.</th><th>Nama Tamu</th><th>Sapaan</th><th>No. WhatsApp</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody id="guestBody"></tbody>
        </table>
        <div id="empty" class="empty" style="display:none">Belum ada tamu untuk pengirim ini.</div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="previewModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>💬 Preview Pesan</h3>
      <button type="button" class="close" id="closePreviewBtn">Tutup</button>
    </div>
    <div id="previewMessage" class="message"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button type="button" class="secondary" style="flex:1" id="copyBtn">Salin Pesan</button>
      <button type="button" class="success" style="flex:1" id="previewSendBtn">📲 Kirim</button>
    </div>
  </div>
</div>
<div id="snack" class="snack"></div>

<script>
"use strict";

const API_URL="https://script.google.com/a/*/macros/s/AKfycbzXdTs7LpenGEcu4HP3EOq_4TYleXYaN8EL7qbDeURb16MUU7-7ZNBRHjIlHEHkAiLOJA/exec";
const INVITATION_URL="https://ihsansyarifah.github.io/wedding-invitation/";
const PARENT_SENDERS=["Ibu Ihsan","Bapa Ihsan","Mama Syarifah","Bapa Syarifah"];

let allGuests=[];
let currentSender="";
let previewGuest=null;

const $=id=>document.getElementById(id);
function clean(v){return v===null||v===undefined?"":String(v).trim()}
function esc(v){return clean(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function normalizePhone(v){
  let p=clean(v).replace(/[^0-9]/g,"");
  if(!p)return "";
  if(p.startsWith("0"))p="62"+p.slice(1);
  else if(p.startsWith("8"))p="62"+p;
  return p.startsWith("62")?p:"";
}
function showSnack(msg){
  const s=$("snack");s.textContent=msg;s.classList.add("show");
  clearTimeout(window.snackTimer);window.snackTimer=setTimeout(()=>s.classList.remove("show"),2800);
}
function setTemplateNote(){
  $("templateNote").textContent=PARENT_SENDERS.includes(currentSender)?"Template pesan: Orang Tua":"Template pesan: Teman";
}
function login(){
  const value=$("senderSelect").value;
  if(!value){showSnack("Silakan pilih pengirim dulu.");return}
  currentSender=value;localStorage.setItem("undangan_sender",value);
  $("loginCard").style.display="none";$("app").style.display="block";$("logoutBtn").style.display="block";
  $("userLine").textContent="Pengirim: "+value;setTemplateNote();loadGuests();
}
function logout(){
  localStorage.removeItem("undangan_sender");currentSender="";allGuests=[];previewGuest=null;
  $("loginCard").style.display="block";$("app").style.display="none";$("logoutBtn").style.display="none";
  $("userLine").textContent="";$("templateNote").textContent="";$("senderSelect").value="";
}
function init(){
  const saved=localStorage.getItem("undangan_sender");
  if(saved){
    currentSender=saved;$("senderSelect").value=saved;$("loginCard").style.display="none";$("app").style.display="block";$("logoutBtn").style.display="block";
    $("userLine").textContent="Pengirim: "+saved;setTemplateNote();loadGuests();
  }
}
function loadGuests(){
  $("loading").style.display="block";$("tableWrap").style.display="none";
  const cb="cb_"+Date.now();
  window[cb]=result=>{
    try{
      if(!result||!result.success){showSnack("Gagal mengambil data tamu.");return}
      allGuests=Array.isArray(result.data)?result.data:[];updateStats();render();
    }finally{
      $("loading").style.display="none";$("tableWrap").style.display="block";
      try{delete window[cb]}catch(e){}
      const sc=$(cb);if(sc)sc.remove();
    }
  };
  const script=document.createElement("script");
  script.id=cb;
  script.src=API_URL+"?action=guests&callback="+encodeURIComponent(cb)+"&_="+Date.now();
  script.onerror=()=>{ $("loading").style.display="none";showSnack("Gagal menghubungkan ke database."); };
  document.body.appendChild(script);
}
function getMyGuests(){return allGuests.filter(g=>clean(g["Pengirim"])===currentSender)}
function updateStats(){
  const mine=getMyGuests(),sent=mine.filter(g=>clean(g["Status"]).toLowerCase()==="terkirim").length;
  $("totalCount").textContent=mine.length;$("sentCount").textContent=sent;$("pendingCount").textContent=mine.length-sent;
}
function render(){
  const body=$("guestBody"),empty=$("empty"),q=clean($("searchInput").value).toLowerCase(),filter=$("statusFilter").value;
  const list=getMyGuests().filter(g=>{
    const name=clean(g["Nama Tamu"]).toLowerCase(),phone=clean(g["No. WhatsApp"]).toLowerCase(),status=clean(g["Status"])||"Belum dikirim";
    return (!q||name.includes(q)||phone.includes(q))&&(filter==="all"||status===filter);
  });
  body.innerHTML="";empty.style.display=list.length?"none":"block";
  list.forEach((g,i)=>{
    const status=clean(g["Status"])||"Belum dikirim",isSent=status==="Terkirim",id=clean(g["ID"]);
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${i+1}</td><td><b>${esc(g["Nama Tamu"])}</b></td><td>${esc(g["Sapaan"])}</td><td>${esc(g["No. WhatsApp"])}</td><td><span class="status ${isSent?"sent":"pending"}">${esc(status)}</span></td><td><div class="actions"><button type="button" class="secondary preview-btn" data-id="${esc(id)}">💬 Lihat Pesan</button><button type="button" class="primary send-btn" data-id="${esc(id)}">📲 Kirim</button><button type="button" class="${isSent?"secondary":"success"} status-btn" data-id="${esc(id)}" data-status="${isSent?"Belum dikirim":"Terkirim"}">${isSent?"↩ Belum":"☑ Terkirim"}</button></div></td>`;
    body.appendChild(tr);
  });
}
function findById(id){return allGuests.find(g=>String(g["ID"])===String(id))}
function makeMessage(g){
  const sapaan=clean(g["Sapaan"])||"Bapak/Ibu/Saudara/i";
  const nama=clean(g["Nama Tamu"]);
  const tujuan=nama?sapaan+" "+nama:sapaan;
  const link=INVITATION_URL+"?to="+encodeURIComponent(nama).replace(/\+/g,"%20");

  // Bentuk emoji dari Unicode code point agar karakter emoji tidak disimpan mentah di HTML.
  const EMOJI_CALENDAR = String.fromCodePoint(0x1F5D3, 0xFE0F);
  const EMOJI_CLOCK = String.fromCodePoint(0x1F553);
  const EMOJI_LOCATION = String.fromCodePoint(0x1F4CD);
  const detail=`${EMOJI_CALENDAR} Hari, Tanggal: *Minggu, 20 Desember 2026*
${EMOJI_CLOCK} Jam: *11.00 - 14.00 WIB*
${EMOJI_LOCATION} Tempat: *Masjid Cibadak Daarul Matiin*
*(Jl. Siliwangi No.12, Cibadak, Kec. Cibadak, Kabupaten Sukabumi, Jawa Barat 43357)*
Link undangan dapat diakses lengkap di *${link}*`;

  if(PARENT_SENDERS.includes(currentSender)){
    return `*Yth. ${tujuan}*
Di Tempat
-----------------------------------------------------

بِسْــــــــــــــــــمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ

ٱلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللّٰهِ وَبَرَكَاتُهُ


Dengan segala kerendahan hati dan dengan ungkapan syukur atas karunia Allah SWT, kami mengundang *${tujuan}* untuk menghadiri *resepsi pernikahan putra-putri kami* yang Insya Allah akan dilaksanakan pada:

===========================
${detail}
===========================

Kehadiran *${tujuan}* adalah silaturahmi.
Doa restu *${tujuan}* adalah kado terindah bagi kami.
Kehadiran *${tujuan}* adalah doa restu yang tidak ternilai harganya.

Jazakumullahu khoiron katsiron, hanya kepada Ilahi Robbi tercurah doa sebagai ungkapan terima kasih kami.

وَالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللّٰهِ وَبَرَكَاتُهُ`;
  }

  return `Assalamu’alaikum Warahmatullahi Wabarakatuh

*Yth. ${tujuan}*

Dengan penuh rasa syukur atas karunia Allah SWT, dengan segala kerendahan hati kami mengundang *${tujuan}* untuk berkenan hadir dalam momen istimewa pernikahan kami.

Insya Allah, resepsi pernikahan kami akan dilaksanakan pada:

${detail}

Suatu kebahagiaan bagi kami apabila *${tujuan}* berkenan hadir, bersilaturahmi, serta memberikan doa dan restu untuk mengiringi langkah kami dalam membangun kehidupan bersama.

Jazakumullahu khoiron katsiron atas perhatian dan doa yang diberikan.

Dengan hangat,
*Ihsan & Syarifah* 🤍

Wassalamu’alaikum Warahmatullahi Wabarakatuh`;
}

function showPreview(g){
  if(!g){showSnack("Data tamu tidak ditemukan.");return}
  previewGuest=g;$("previewMessage").textContent=makeMessage(g);$("previewModal").classList.add("show");
}
function hidePreview(){$("previewModal").classList.remove("show");previewGuest=null}
function openWhatsApp(g){
  const p=normalizePhone(g["No. WhatsApp"]);
  if(!p){showSnack("Nomor WhatsApp tidak valid.");return false}
  const url="https://api.whatsapp.com/send?phone="+p+"&text="+encodeURIComponent(makeMessage(g));
  const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.style.display="none";
  document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);return true;
}
function updateStatus(id,status){
  const url=API_URL+"?action=updateStatus&id="+encodeURIComponent(id)+"&status="+encodeURIComponent(status)+"&_="+Date.now();
  const img=new Image();img.src=url;
  const g=findById(id);if(g)g["Status"]=status;
  updateStats();render();showSnack(status==="Terkirim"?"Status: Terkirim":"Status: Belum dikirim");
}
function copyText(text){
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>showSnack("Pesan berhasil disalin.")).catch(()=>fallbackCopy(text));
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");showSnack("Pesan berhasil disalin.")}catch(e){showSnack("Tidak bisa menyalin otomatis.")}ta.remove();
}

$("loginBtn").addEventListener("click",login);
$("logoutBtn").addEventListener("click",logout);
$("searchInput").addEventListener("input",render);
$("statusFilter").addEventListener("change",render);
$("closePreviewBtn").addEventListener("click",hidePreview);
$("previewModal").addEventListener("click",e=>{if(e.target===$("previewModal"))hidePreview()});
$("copyBtn").addEventListener("click",()=>{if(previewGuest)copyText(makeMessage(previewGuest))});
$("previewSendBtn").addEventListener("click",()=>{if(previewGuest&&openWhatsApp(previewGuest))hidePreview()});
$("guestBody").addEventListener("click",e=>{
  const btn=e.target.closest("button");
  if(!btn)return;
  const id=btn.dataset.id,g=findById(id);
  if(!g)return;
  if(btn.classList.contains("preview-btn"))showPreview(g);
  else if(btn.classList.contains("send-btn"))openWhatsApp(g);
  else if(btn.classList.contains("status-btn"))updateStatus(id,btn.dataset.status);
});

window.addEventListener("load",init);
</script>
</body>
</html>
